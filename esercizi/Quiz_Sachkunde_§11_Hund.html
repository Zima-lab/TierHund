{c:"gesund",t:"mc",q:"Warum ist eine flächendeckende Tollwutimpfung aller Hunde in Deutschland nicht mehr erforderlich?",o:["Die terrestrische Tollwut ist in Deutschland getilgt","Tollwut ist nicht auf Menschen übertragbar","Es gibt keinen Impfstoff mehr","Hunde können sich nicht anstecken"],a:[0],e:"Aber: Nur geimpfte Heimtiere dürfen grenzüberschreitend reisen; geimpfte Tiere sind nach der Tollwutverordnung bei Kontakt mit verdächtigen Tieren besser gestellt."},
{c:"gesund",t:"mc",q:"Ab welchem Alter reicht eine Tollwutimpfung (nach Herstellerangaben) für grenzüberschreitendes Reisen?",o:["Ab 12 Wochen","Ab 4 Wochen","Ab 1 Jahr","Ab 6 Monaten"],a:[0],e:"Für manche Länder außerhalb der EU zusätzlich ein Antikörpertiter ≥ 0,5 IE/ml."},
{c:"gesund",t:"mc",q:"Was wird für Reisen in bestimmte Länder außerhalb der EU zusätzlich zur Tollwutimpfung verlangt?",o:["Nachweis eines Antikörpertiters von mindestens 0,5 IE/ml","Ein Hundeführerschein","Eine Kastration","Ein negativer Leptospirose-Test"],a:[0],e:"Drei Impfungen (12. und 16. Woche, 15. Monat) erhöhen die Wahrscheinlichkeit, diesen Titer zu erreichen."},
{c:"gesund",t:"mc",q:"In welchem Abstand werden Parvovirose und Staupe nach erfolgreicher Grundimmunisierung wiederholt?",o:["Je nach Hersteller bis zu 3 Jahre","Jedes halbe Jahr","Immer jährlich","Nie wieder"],a:[0],e:"Leptospirose dagegen jährlich."},
{c:"gesund",t:"multi",q:"Welche Impfungen sind laut StIKo Vet Non-Core? (mehrere richtig)",o:["Babesiose","Leishmaniose","Zwingerhusten","Staupe","Parvovirose"],a:[0,1,2],e:"Non-Core = nicht weniger wichtig, aber nur für exponierte Tiere; Entscheidung im Impfgespräch für jedes Tier."},
{c:"gesund",t:"mc",q:"Warum lässt sich die Impfung gegen HCC kaum vermeiden, obwohl sie nicht mehr Core ist?",o:["Fast alle Staupe- und Parvovirose-Impfstoffe enthalten eine HCC-Komponente","Sie ist gesetzlich vorgeschrieben","Sie ist für Reisen Pflicht","HCC ist eine häufige Zoonose"],a:[0],e:"Durch konsequente Impfung ist HCC in Westeuropa nur noch sehr selten."},
{c:"gesund",t:"mc",q:"Wie werden Reisekrankheiten vor allem nach Deutschland eingeschleppt?",o:["Durch den Import von Tieren aus betroffenen Ländern","Durch Urlaubsreisen mit dem eigenen Hund","Durch Trockenfutter","Durch Vögel"],a:[0],e:"Urlaubsaufenthalte sind laut Folie unbedeutend. Durch Tiertransporte können getilgt geglaubte Krankheiten (Tollwut, Staupe, HCC) wieder auftreten."},
{c:"gesund",t:"multi",q:"Welche Reisekrankheiten sind laut Folie in Deutschland bereits „heimisch“? (mehrere richtig)",o:["Babesiose","Ehrlichiose","Anaplasmose","Leishmaniose","Staupe"],a:[0,1,2],e:"Bei der Leishmaniose wartet man noch auf das Erscheinen der übertragenden Vektoren."},
{c:"gesund",t:"multi",q:"Welche Zoonosen werden über Vektoren (blutsaugende Parasiten) übertragen? (mehrere richtig)",o:["Leishmaniose","Borreliose","FSME","Spulwürmer","Giardien"],a:[0,1,2],e:"Direkt durch Hunde übertragbar: Tollwut, Spulwürmer, Giardien, Flöhe, Hautpilze, Leptospirose."},
{c:"gesund",t:"mc",q:"Welche Spätfolge kann eine überlebte Parvovirose haben?",o:["Bleibende Schäden durch Herzmuskelentzündung","Blindheit","Taubheit","Hartballenkrankheit"],a:[0],e:"Symptome: plötzliches starkes Erbrechen, wässriger oft blutiger Durchfall, Fieber bis 41,5 °C, Dehydration."},
{c:"gesund",t:"mc",q:"Ein junger, ungeimpfter Importhund hat plötzlich starkes Erbrechen und wässrigen, blutigen Durchfall. Woran muss man vor allem denken?",o:["Parvovirose","Zwingerhusten","Ohrräude","Demodikose"],a:[0],e:"Sofort zum Tierarzt (Dehydration), Hund absondern, Umgebung gründlich reinigen und desinfizieren."},
{c:"gesund",t:"mc",q:"Wie gelangt das HCC-Virus in den Körper?",o:["Oronasal (über Maul und Nase)","Nur durch Zeckenstich","Durch die unverletzte Haut","Über Mückenstiche"],a:[0],e:"Canines Adenovirus; keine spezifische Therapie, nur symptomatische Behandlung."},
{c:"gesund",t:"mc",q:"Wie dringen Leptospiren in den Körper ein?",o:["Durch kleine Haut- oder Schleimhautverletzungen","Nur über die Atemluft","Nur durch Zeckenstich","Nur über rohes Fleisch"],a:[0],e:"Wichtigster Weg: Wasser, das mit Nagerharn verschmutzt ist (Pfützen, stehende Gewässer im Sommer); auch beim Baden."},
{c:"gesund",t:"multi",q:"Welche Hunde haben ein besonders hohes Leptospirose-Risiko? (mehrere richtig)",o:["Jagdhunde","„Wasserratten“ wie Retriever","Hunde in Reitställen und auf dem Land","Hunde, die nie nach draußen gehen"],a:[0,1,2],e:"Außerdem alle Hunde, die auf Wiesen, Feldern und im Wald spazieren gehen."},
{c:"gesund",t:"mc",q:"Welches Symptom ist typisch für Zwingerhusten?",o:["Trockener, wiederkehrender Husten bei Anstrengung und Aufregung; Allgemeinbefinden meist ungestört","Blutiger Durchfall","Lähmungen der Hinterbeine","Gelbsucht"],a:[0],e:"Übertragung aerogen durch Tröpfcheninfektion."},
{c:"gesund",t:"multi",q:"Welche Faktoren begünstigen Zwingerhusten? (mehrere richtig)",o:["Überbesetzung und Gruppenhaltung","Mangelhafte Hygiene","Ungünstige Temperatur und Luftfeuchtigkeit","Stress durch lange Transporte oder Besitzerwechsel","Einzelhaltung ohne Hundekontakt"],a:[0,1,2,3],e:"Auch starker Wurmbefall schwächt das Immunsystem."},
{c:"gesund",t:"mc",q:"Was ist aktive Immunität?",o:["Der Körper bildet nach Kontakt mit einem Erreger eigene Antikörper, die bei erneutem Kontakt aktiviert werden","Antikörper, die der Welpe von der Mutter erhält","Ein Medikament gegen Viren","Ein Impfstoff ohne Erreger"],a:[0],e:"Bei der Impfung wird die Infektion „nachgestellt“, ohne die Krankheit auszulösen."},
{c:"gesund",t:"mc",q:"Wozu werden Totimpfstoffen Adjuvantien zugesetzt?",o:["Um die Immunantwort zu verstärken","Um den Erreger am Leben zu halten","Um den Geschmack zu verbessern","Um jede Nebenwirkung auszuschließen"],a:[0],e:"Auf abgetötete Erreger reagiert der Körper schwächer als auf Lebendvakzine."},
{c:"gesund",t:"mc",q:"Warum wirkt die Schutzimpfung bei manchen jungen Welpen noch nicht?",o:["Wegen der maternalen Antikörper","Welpen haben kein Immunsystem","Impfstoffe für Welpen gibt es nicht","Weil Welpen zu wenig fressen"],a:[0],e:"Deshalb mehrere Impfungen in der Grundimmunisierung (8., 12., 16. Woche, 15. Monat)."},
{c:"gesund",t:"mc",q:"Was ist typisch für die Sarcoptes-Räude?",o:["Starker Juckreiz, rasch ansteckend auch auf andere Caniden; Behandlung 8 Wochen oder länger","Kaum Juckreiz, v. a. bei Molossern","Kommt nur bei Katzen vor","Heilt in wenigen Tagen von selbst"],a:[0],e:"„Fuchsräude“; nicht leicht zu diagnostizieren."},
{c:"gesund",t:"mc",q:"Ein Hund kratzt sich stark an den Ohren, im Gehörgang ist kaffeesatzartiges Sekret. Was ist wahrscheinlich und was ist zu tun?",o:["Ohrräude – auch die Katzen im Haushalt überprüfen","Zwingerhusten – sofort impfen","Giardien – Kotprobe","Leptospirose – Pfützen meiden"],a:[0],e:"Ohrmilben werden oft von Katzen übertragen."},
{c:"gesund",t:"mc",q:"Von welchen Tieren werden Raubmilben (Cheyletiella) meist auf den Hund übertragen?",o:["Von Katzen oder Kaninchen","Von Füchsen","Von Vögeln","Von Pferden"],a:[0],e:"Beim Hund eher selten; starke Hautrötung und Juckreiz."},
{c:"gesund",t:"multi",q:"Welche Probleme können Flöhe verursachen? (mehrere richtig)",o:["Allergische Reaktionen","Übertragung von Bandwürmern","Blutverlust durch Saugen","Staupe"],a:[0,1,2],e:"Auf dem Hund finden sich nur die adulten Flöhe."},
{c:"gesund",t:"mc",q:"Welche Aussage zu Zecken ist richtig?",o:["Zecken sind Spinnentiere und nicht wirtsspezifisch","Zecken sind Insekten und leben nur auf Hunden","Zecken saugen jeden Tag Blut","Zecken übertragen Staupe"],a:[0],e:"Folie: 3 Stadien (Nymphe I, Nymphe II, adulte Zecke), je Stadium i. d. R. 1× Blut. Übertragen z. B. Babesiose und Borreliose."},
{c:"gesund",t:"mc",q:"Wie lange wirken Floh- und Zeckenhalsbänder laut Folie?",o:["Mindestens 6 Monate","1 Woche","1 Tag","5 Jahre"],a:[0],e:"Weitere Mittel: Spot-on-Präparate, Tabletten. Tierärztlichen Rat einholen."},
{c:"gesund",t:"mc",q:"Welche Aussage zu Bandwürmern ist richtig?",o:["Sie sind nicht direkt von Tier zu Tier übertragbar und schädigen eher den Zwischenwirt","Sie werden mit der Muttermilch übertragen","Sie dringen durch die Haut ein","Sie brauchen keinen Zwischenwirt"],a:[0],e:"Beispiel Fuchsbandwurm. Bei starkem Befall auch Schaden für den Wirt (Vitamin- und Nährstoffentzug)."},
{c:"gesund",t:"mc",q:"Wie werden Spulwürmer oft auf Welpen übertragen?",o:["Mit der Muttermilch","Durch Zeckenstiche","Durch Mücken","Durch die Atemluft"],a:[0],e:"Hakenwürmer können durch die Haut eindringen. Rundwürmer brauchen keinen Zwischenwirt."},
{c:"gesund",t:"mc",q:"Wie oft wird ein Junghund ab der 12. Woche bis zum Alter von einem Jahr entwurmt?",o:["Alle 3 Monate gegen Rund- und Bandwürmer","Jede Woche","Einmal im Jahr","Gar nicht"],a:[0],e:"Danach je nach Bedarf 1 – 4× jährlich."},
{c:"gesund",t:"mc",q:"In einem Haushalt mit drei Hunden hat einer Würmer. Was gilt für die Entwurmung?",o:["Immer den gesamten Tierbestand behandeln","Nur den betroffenen Hund behandeln","Ein Langzeitpräparat geben, das ein Jahr schützt","Abwarten"],a:[0],e:"Es gibt keine Langzeitpräparate; ein Neubefall ist schon nach wenigen Tagen möglich."},
{c:"gesund",t:"multi",q:"Welche Vorbeugemaßnahmen gegen Würmer nennt die Folie? (mehrere richtig)",o:["Flohbekämpfung","Muttertiere vor der Laktation entwurmen","Kotfressen und rohes Wildfleisch vermeiden","Ein Langzeitpräparat für ein ganzes Jahr"],a:[0,1,2],e:"Dazu prophylaktische Behandlung in regelmäßigen Abständen."},
{c:"gesund",t:"multi",q:"Welche anhaltenden Zeichen deuten darauf hin, dass ein Hund krank ist? (mehrere richtig)",o:["Zugekniffene Augen","Veränderte Schleimhautfarbe","Veränderte Körperhaltung","Glänzendes, rassetypisches Fell","Normaler Kotabsatz"],a:[0,1,2],e:"Außerdem Lahmheit, Durchfall, Erbrechen, Husten, Juckreiz, Ausfluss, Schwellungen, veränderte Temperatur, verändertes Verhalten."},
{c:"gesund",t:"mc",q:"Welche Schleimhautfarbe ist ein Notfallzeichen?",o:["Sehr blass, grau oder leicht bläulich","Rosa","Feucht und hellrosa","Rosa, nach Druck schnell wieder rosa"],a:[0],e:"Notfall = das Leben des Patienten ist bedroht."},
{c:"gesund",t:"mc",q:"Was verursachen Giardien und wie stellt man sie fest?",o:["Schleimige Durchfälle; Diagnose über Kotprobe","Husten; Diagnose über Röntgen","Juckreiz; Diagnose über Hautprobe","Lahmheit; Diagnose über Blutbild"],a:[0],e:"Schmierinfektion über Futter, Wasser, Umgebung; Zoonose. In größeren Beständen schwer zu beherrschen."},
{c:"gesund",t:"mc",q:"Darf eine Hundepension eigene Impfanforderungen stellen?",o:["Ja – Pensionen, Tierheime und Veranstalter können eigene Anforderungen stellen","Nein, nur die StIKo Vet entscheidet","Nur das Veterinäramt darf das","Nur für Tollwut"],a:[0],e:"Folie Impfungen bei Hund und Katze. Am besten schriftlich im Vertrag festhalten."},
{c:"gesund",t:"open",q:"Wie wird Leptospirose übertragen und welche Hunde sind besonders gefährdet?",m:"Bakterien dringen durch kleine Haut- oder Schleimhautverletzungen ein, v. a. über Wasser mit Nagerharn (Pfützen, stehende Gewässer, Sommer), auch beim Baden. Gefährdet: Jagdhunde, Hunde auf dem Land und in Reitställen, Retriever, alle Hunde auf Wiesen, Feldern, im Wald. Zoonose; Impfung jährlich wiederholen.",k:["Nagerharn / Pfützen / stehende Gewässer","Haut- / Schleimhautverletzungen","Risikogruppen","Zoonose / jährliche Impfung"]},
{c:"gesund",t:"open",q:"Nennen Sie das Entwurmungsschema für Welpen und Junghunde laut Folie.",m:"Ab der 3. Woche gegen Rundwürmer; ab der 12. Woche alle 3 Monate bis zu einem Jahr gegen Rund- und Bandwürmer; danach je nach Bedarf 1 – 4× jährlich. Immer den gesamten Bestand behandeln; Muttertiere vor der Laktation entwurmen.",k:["ab 3. Woche Rundwürmer","ab 12. Woche alle 3 Monate bis 1 Jahr","danach 1 – 4× jährlich","gesamter Bestand"]},
// ---------------- ERGÄNZUNG: LERNVERHALTEN ----------------
{c:"lernen",t:"mc",q:"Wie definiert die Folie „Lernen“?",o:["Verhaltensanpassung an eine sich verändernde Umwelt als Folge gemachter Erfahrungen","Auswendiglernen von Kommandos","Angeborenes, unveränderliches Verhalten","Reifung des Gehirns ohne Erfahrung"],a:[0],e:"Dient der Optimierung des eigenen Zustands und der Steigerung der biologischen Fitness."},
{c:"lernen",t:"mc",q:"Zu welcher Lernform gehören Habituation und Sensibilisierung?",o:["Nicht-assoziatives Lernen","Klassische Konditionierung","Operante Konditionierung","Lernen am Modell"],a:[0],e:"Assoziativ = klassische und operante (instrumentelle) Konditionierung."},
{c:"lernen",t:"mc",q:"Habituation ist eine Anpassung an …",o:["… die bedeutungslose Umwelt","… die bedeutungsvolle Umwelt","… gefährliche Reize","… Belohnungen"],a:[0],e:"Sensibilisierung = Anpassung an die bedeutungsvolle Umwelt (Reize, die Gefahr signalisieren)."},
{c:"lernen",t:"mc",q:"Bei welchen Reizen tritt Sensibilisierung vor allem auf?",o:["Bei Reizen, die den Schreckreflex auslösen","Bei Reizen ohne jede Folge","Bei Futterbelohnung","Bei vertrauten, harmlosen Reizen"],a:[0],e:"Das Tier reagiert immer stärker, auch wenn der Reiz immer schwächer dargeboten wird."},
{c:"lernen",t:"mc",q:"Wann tritt Habituation besonders auf?",o:["Bei „neuen“ Reizen, die ohne attraktive oder aversive Folgen bleiben","Bei Reizen, die Schmerzen auslösen","Bei Reizen, die immer belohnt werden","Nur bei erwachsenen Hunden"],a:[0],e:"Der Reiz ist BEDEUTUNGSLOS → die Reaktion wird schwächer, bis keine Reaktion mehr erfolgt."},
{c:"lernen",t:"mc",q:"Was passiert bei der klassischen Konditionierung?",o:["Zwei unabhängige Reize, die zeitlich eng zusammen auftreten, werden verknüpft","Ein Verhalten wird durch seine Folgen häufiger oder seltener","Die Reaktion auf einen Reiz wird schwächer","Der Hund ahmt andere Hunde nach"],a:[0],e:"Klassische Konditionierung gibt Reizen eine (emotionale) Bedeutung."},
{c:"lernen",t:"mc",q:"Der Hund freut sich, sobald der Halter die Leine nimmt, weil danach der Spaziergang kommt. Welche Lernform ist das?",o:["Klassische Konditionierung","Habituation","Negative Strafe","Sensibilisierung"],a:[0],e:"Ein neutraler Reiz (Leine) bekommt durch Verknüpfung eine attraktive emotionale Bewertung."},
{c:"lernen",t:"mc",q:"Wann findet klassische Konditionierung statt?",o:["Immer – in jeder Trainingseinheit","Nur wenn man sie gezielt trainiert","Nur bei Welpen","Nur mit Futter"],a:[0],e:"Es entstehen Assoziationen zwischen Umweltreizen und unwillkürlichen physiologischen oder emotionalen Reaktionen."},
{c:"lernen",t:"mc",q:"Hund setzt sich → er bekommt Futter / Spiel → das Sitzen wird häufiger. Was ist das?",o:["Positive Verstärkung","Negative Verstärkung","Positive Strafe","Negative Strafe"],a:[0],e:"Positiv = etwas wird hinzugefügt; Verstärkung = das Verhalten nimmt zu."},
{c:"lernen",t:"mc",q:"Welches Gefühl ordnet die Folie der negativen Strafe zu?",o:["Frustration","Erleichterung","Freude","Schmerz"],a:[0],e:"Positive Verstärkung: Freude · negative Verstärkung: Erleichterung · positive Strafe: Angst, Schmerz · negative Strafe: Frustration."},
{c:"lernen",t:"mc",q:"Ein Hund springt zur Begrüßung hoch. Die Halterin dreht sich jedes Mal weg und beachtet ihn nicht. Das Hochspringen wird seltener. Was ist das?",o:["Negative Strafe","Positive Strafe","Negative Verstärkung","Habituation"],a:[0],e:"Etwas Angenehmes (Aufmerksamkeit) wird entzogen → das Verhalten nimmt ab."},
{c:"lernen",t:"mc",q:"Ein Hund bellt am Zaun, der Briefträger geht weiter. Das Bellen wird immer häufiger. Was erklärt das am besten?",o:["Negative Verstärkung – aus Sicht des Hundes verschwindet etwas Unangenehmes","Positive Strafe","Habituation","Negative Strafe"],a:[0],e:"Verstärkung = Verhalten nimmt zu; negativ = etwas wird entfernt."},
{c:"lernen",t:"mc",q:"Was bedeutet „Strafe“ bei der instrumentellen Konditionierung?",o:["Das Verhalten wird seltener gezeigt","Das Verhalten wird häufiger gezeigt","Der Hund bekommt immer Schmerzen","Der Reiz wird stärker"],a:[0],e:"Verstärkung = Verhalten nimmt zu, Strafe = Verhalten nimmt ab; positiv/negativ = hinzufügen/entfernen."},
{c:"lernen",t:"mc",q:"Welche Forscher stehen symbolisch für klassische und operante Konditionierung?",o:["Pawlow und Skinner","Tinbergen und Rugaas","Billinghurst und Mech","Schjelderup-Ebbe und Freedman"],a:[0],e:"Pawlow: klassische Konditionierung · Skinner: operante Konditionierung."},
{c:"lernen",t:"mc",q:"Ein Hund hat Angst vor Böllern. Ein Trainer setzt ihn ohne Vorbereitung lauten Knallern aus, „damit er sich daran gewöhnt“. Welches Risiko besteht?",o:["Sensibilisierung: die Angst kann stärker werden","Keins, Habituation tritt immer ein","Der Hund wird dadurch taub","Klassische Konditionierung auf Futter"],a:[0],e:"Bei Reizen, die den Schreckreflex auslösen, droht Sensibilisierung statt Habituation. Tierschutz: keine erheblichen Leiden zufügen."},
{c:"lernen",t:"open",q:"Was ist der Unterschied zwischen klassischer und instrumenteller (operanter) Konditionierung? Je ein Beispiel.",m:"Klassisch: zwei Reize werden verknüpft, ein neutraler Reiz bekommt eine emotionale Bedeutung (Leine → Spaziergang → Freude). Instrumentell: ein Verhalten wird durch seine Folgen häufiger oder seltener (Sitz → Futter → mehr Sitz).",k:["klassisch: Reiz + Reiz, emotionale Bedeutung","instrumentell: Verhalten + Folge","Beispiel klassisch","Beispiel instrumentell"]},
{c:"lernen",t:"open",q:"Was ist der Unterschied zwischen Habituation und Sensibilisierung?",m:"Beide sind nicht-assoziativ. Habituation: die Reaktion auf einen wiederholten, bedeutungslosen Reiz wird schwächer. Sensibilisierung: die Reaktion auf einen Reiz, der Gefahr signalisiert (Schreckreflex), wird immer stärker, auch wenn der Reiz schwächer wird.",k:["nicht-assoziativ","Habituation: Reaktion schwächer, Reiz bedeutungslos","Sensibilisierung: Reaktion stärker, Gefahr / Schreckreflex"]},

// ---------------- ERGÄNZUNG: KÖRPERSPRACHE ----------------
{c:"sprache",t:"mc",q:"Was besagt das zirkuläre Kommunikationsmodell?",o:["Beide Partner sind verantwortlich, sich um Verstehen und Verstanden-Werden zu bemühen","Nur der Sender ist verantwortlich","Nur der Empfänger ist verantwortlich","Kommunikation läuft nur in eine Richtung"],a:[0],e:"Verhalten wird gegenseitig wahrgenommen, interpretiert, bewertet und löst Reaktionen aus."},
{c:"sprache",t:"multi",q:"Über welche Signale kommunizieren Hunde? (mehrere richtig)",o:["Optische Signale (Gestik, Mimik)","Geruchliche Signale","Berührungssignale","Lautsignale","Erlernte Wörter wie in der menschlichen Sprache"],a:[0,1,2,3],e:"Optisch, olfaktorisch, taktil, akustisch."},
{c:"sprache",t:"mc",q:"Was ist der Unterschied zwischen Gestik und Mimik?",o:["Gestik = Körperausdruck, Mimik = Ausdruck des Gesichts","Gestik = Lautäußerung, Mimik = Geruch","Es gibt keinen Unterschied","Mimik = Rutenhaltung"],a:[0],e:"Beides gehört zu den optischen Signalen."},
{c:"sprache",t:"mc",q:"Ein Hund zieht die Ohren nach hinten. Wie verändern sich meist die Augen?",o:["Sie werden schlitzförmig","Sie werden rund","Sie bleiben unverändert","Sie schließen sich ganz"],a:[0],e:"Ohren nach vorne = Augen eher rund. Rassebedingte Unterschiede beachten."},
{c:"sprache",t:"mc",q:"Langer, spitzer Lefzenspalt, auch hintere Zähne sichtbar – welches Drohen ist das eher?",o:["Eher unsicheres, defensives Drohen","Eher sicheres, offensives Drohen","Eine Spielaufforderung","Neutrale Aufmerksamkeit"],a:[0],e:"Kurzer, runder Lefzenspalt, nur vordere Zähne = eher offensiv. Immer den ganzen Körper lesen."},
{c:"sprache",t:"mc",q:"Was ist ein „Display“?",o:["Die Bündelung von Signalkomponenten zu einer Bedeutungseinheit, z. B. Angst- oder Spieldisplay","Ein einzelnes Ohrsignal","Ein Bildschirm im Training","Ein Messgerät für Stress"],a:[0],e:"Entscheidend ist, was „unterm Strich“ beim Empfänger ankommt."},
{c:"sprache",t:"mc",q:"Ein Hund nähert sich, weicht im nächsten Moment aus und nähert sich wieder. Wie nennt man das?",o:["Ambivalentes Verhalten","Imponierverhalten","Neutrale Aufmerksamkeit","Jagdverhalten"],a:[0],e:"In kürzester Zeit Signale mit unterschiedlichen Schwerpunkten, z. B. Annäherung ⇔ Meideverhalten."},
{c:"sprache",t:"multi",q:"Welche Signale zeigen Unsicherheit / Angst? (mehrere richtig)",o:["Blick vermeiden","Ohren seitlich bis nach hinten","Rute tief, eingeklemmt","Ohren hoch, Ohröffnung nach vorne","Lefzen entspannt, Maul leicht offen"],a:[0,1,2],e:"Außerdem Kopf abwenden, Stirn flach, Augen schlitzförmig, Körper klein und rund."},
{c:"sprache",t:"mc",q:"Ohren hoch und nach vorne, Nasenrücken glatt, Maul leicht offen, Lefzen entspannt. Was zeigt der Hund?",o:["Neutrale Aufmerksamkeit","Unsicherheit / Angst","Defensives Drohen","Passive Demut"],a:[0],e:"Kopf leicht aufgerichtet; Rute meist auf Rückenhöhe oder locker hängend (je nach Rasse)."},
{c:"sprache",t:"mc",q:"Was kennzeichnet Verhalten der sozialen Annäherung?",o:["Es verringert den Abstand und wird in entspannter, freundlicher Stimmung gezeigt","Es vergrößert den Abstand","Es dient dem Angriff","Es kommt nur bei Welpen vor"],a:[0],e:"Sozio-positiv, z. B. Schnuppern, Lecken, Reiben, Pföteln; dient Bindung und Informationsaustausch."},
{c:"sprache",t:"mc",q:"Ein Junghund zeigt einem älteren Hund sehr aufgeregt und aufdringlich aktive Demut. Der ältere knurrt. Wie ist das zu bewerten?",o:["Normale Kommunikation: aufdringliche aktive Demut kann belästigen, der ältere Hund bittet um Abstand","Der ältere Hund ist gefährlich und muss bestraft werden","Der Junghund will den älteren dominieren","Das ist Jagdverhalten"],a:[0],e:"Wird die aktive Demut noch aufgeregter, wird der Adressat immer genervter – die Situation ruhig unterbrechen."},
{c:"sprache",t:"mc",q:"Was ist das Ziel der passiven Demut?",o:["Abstand vergrößern oder bedrohliches Verhalten des anderen beenden","Den anderen zum Spiel auffordern","Den anderen beeindrucken","Futter erbetteln"],a:[0],e:"Reaktion auf empfundene Bedrohung oder starken Stress: Hinlegen, Seiten- oder Rückenlage, Urinieren, Fiepen, Winseln."},
{c:"sprache",t:"mc",q:"Ein Hund liegt auf dem Rücken und uriniert, wird aber weiter festgehalten und geschimpft. Was kann passieren?",o:["Er kann ins Abwehrdrohen oder offensive Verhalten wechseln","Er wird sicher ruhig","Er lernt, dass Menschen freundlich sind","Nichts"],a:[0],e:"Wird passive Demut vom Gegenüber nicht anerkannt, sind Abwehrdrohen / offensives Verhalten möglich."},
{c:"sprache",t:"multi",q:"Welche Elemente gehören zum Imponierverhalten? (mehrere richtig)",o:["T-Stellung","Kopf oder Pfote auflegen","Erhobener Schwanz, Körper aufgerichtet und angespannt","Auf den Rücken rollen","Züngeln und Gähnen"],a:[0,1,2],e:"Außerdem Blickfixieren ohne weitere Drohsignale, Imponierpinkeln, Imponierscharren."},
{c:"sprache",t:"mc",q:"Was beinhaltet Drohverhalten NICHT?",o:["Eine direkte, absichtsvolle körperliche Verletzung des Gegenübers","Knurren","Zähnezeigen","Nasenrückenrunzeln"],a:[0],e:"Kleinere Verletzungen wie Kratzer oder Hautrisse sind trotzdem möglich."},
{c:"sprache",t:"multi",q:"Welche Drohsignale werden von Menschen oft übersehen? (mehrere richtig)",o:["Kurze Anspannung","Leichtes Anheben der Lefzen","Kurzfristiges Blickfixieren","Lautes Bellen","Vorspringen mit Zähnezeigen"],a:[0,1,2],e:"Drohverhalten besser als „Bitte um Abstand“ verstehen."},
{c:"sprache",t:"mc",q:"Welcher Hund kann besonders leicht in den Angriff übergehen, wenn man die Distanz weiter verringert?",o:["Ein unsicher drohender Hund","Ein spielender Hund","Ein Hund in neutraler Aufmerksamkeit","Ein schlafender Hund"],a:[0],e:"Oft werden unsichere und sichere Elemente gemischt = ambivalentes Verhalten."},
{c:"sprache",t:"mc",q:"Was unterscheidet gehemmtes von ungehemmtem offensivem Verhalten?",o:["Gehemmt: kontrollierte Kraft (z. B. Überfall, Ringen); ungehemmt: Beißen, Beiß-Schütteln, kurze Attacke","Gehemmtes Verhalten ist immer gefährlicher","Es gibt keinen Unterschied","Ungehemmt heißt nur lautes Bellen"],a:[0],e:"Die Übergänge zwischen Drohen und Angriff sind fließend."},
{c:"sprache",t:"mc",q:"Was ist der Nachteil von Meideverhalten (z. B. demonstratives Kopfabwenden) für den Hund?",o:["Er bleibt in seinem Stresszustand gefangen, weil er nahe beim Kontrahenten bleibt","Er wird sofort angegriffen","Er verliert seine Rangposition","Es gibt keinen Nachteil"],a:[0],e:"Beim Übersprungsverhalten kann der Hund dagegen aktiv handeln und Stress abbauen. Menschen sollten den Hund dann nicht weiter bedrängen."},
{c:"sprache",t:"multi",q:"Welche Funktionen hat Spielverhalten? (mehrere richtig)",o:["Bewegungsabläufe und Kommunikation üben","Überschüssige Energie abbauen","Einen möglichen Sexualpartner testen","Eine feste Rangordnung erkämpfen"],a:[0,1,2],e:"Und: es macht Spaß. Alle Ausdruckselemente werden übertrieben."},
{c:"sprache",t:"mc",q:"Warum kann Spiel zwischen Hunden „kippen“?",o:["Funktionskreise vermischen sich (z. B. Jagd), Rassen und Spielweisen passen nicht zusammen","Weil Spiel immer aggressiv endet","Weil Hunde nur allein spielen","Weil nur Welpen spielen dürfen"],a:[0],e:"Beispiel: ein kleiner, quietschender Hund kann bei einem großen Hund Jagdverhalten auslösen."},
{c:"sprache",t:"mc",q:"Was zeigte die Untersuchung mit 24 Hunden in Dyaden zu Calming Signals?",o:["Calming Signals kommen signifikant häufiger nach aggressivem Verhalten vor; danach endet der Konflikt mit hoher Wahrscheinlichkeit","Calming Signals gibt es nicht","Sie wirken nur bei Welpen","Sie lösen Aggression aus"],a:[0],e:"Fazit: Signale mit „Calming Effect“ existieren und können Eskalation verhindern; Menschen können sie imitieren."},
{c:"sprache",t:"mc",q:"Ist Knurren schon Aggression?",o:["Ja – es ist aggressive Kommunikation (Drohverhalten)","Nein, Knurren ist immer Spiel","Nein, Knurren ist Übersprungsverhalten","Nur wenn der Hund dabei beißt"],a:[0],e:"Folie: „Ist Knurren schon Aggression? JA.“ Drohen ist eine Bitte um Abstand – nicht bestrafen."},
{c:"sprache",t:"mc",q:"In welcher Reihenfolge läuft die Jagdsequenz ab?",o:["Orientieren → Fokussieren → Schleichen → Hetzen → Packen → Töten / Fressen","Hetzen → Orientieren → Packen → Schleichen → Fressen","Packen → Hetzen → Fokussieren → Orientieren → Töten","Schleichen → Töten → Orientieren → Hetzen → Packen"],a:[0],e:"Die Erregung steigt entlang der Sequenz; im Training möglichst früh unterbrechen."},
{c:"sprache",t:"mc",q:"Ein Hund im Gassi-Service fängt an, Jogger zu hetzen. Welche häufige Ursache nennt die Folie?",o:["Langeweile: mangelnde geistige und körperliche Auslastung, der Hund wird sich selbst überlassen","Zu viel Futter","Die Farbe der Leine","Die Kastration"],a:[0],e:"Das Beuteschema wird gelernt; Jagdverhalten ist selbstbelohnend."},
{c:"sprache",t:"mc",q:"Sie führen mehrere fremde Hunde zusammen aus. Welches Risiko nennt die Folie beim Jagdverhalten?",o:["„Mobbing“: mehrere Hunde jagen gemeinsam einen kleineren oder schwächeren Hund","Die Hunde werden alle müde","Die Hunde verlieren den Geruchssinn","Kein Risiko, Hunde jagen nie in der Gruppe"],a:[0],e:"Gruppen passend zusammenstellen, beaufsichtigen und früh unterbrechen."},
{c:"sprache",t:"mc",q:"Was beschreibt „agonistisches Verhalten“?",o:["Alle Verhaltensweisen gegen oder als Reaktion auf eine Bedrohung – offensiv und defensiv","Nur den Angriff","Nur das Spiel","Nur das Sexualverhalten"],a:[0],e:"Dient dazu, räumliche und/oder zeitliche Distanz herzustellen oder zu halten."},
{c:"sprache",t:"open",q:"Nennen Sie die Phasen der Jagdsequenz und erklären Sie, warum man früh unterbrechen sollte.",m:"Orientieren, Fokussieren, Schleichen, Hetzen, Packen, Töten/Fressen. Die Erregung steigt mit jeder Phase, und Jagen ist selbstbelohnend – je später, desto schwerer ist der Hund zu unterbrechen.",k:["Phasen in der richtigen Reihenfolge","Erregung steigt","selbstbelohnend","früh unterbrechen"]},
{c:"sprache",t:"open",q:"Was ist Imponierverhalten, wozu dient es? Nennen Sie Beispiele.",m:"Stärke demonstrieren und das Gegenüber beeindrucken, damit es von einer körperlichen Auseinandersetzung absieht – Imponieren soll den Kampf vermeiden, kann aber in Drohverhalten übergehen. Beispiele: Kopf erhoben, Rute hoch, Körper aufgerichtet, T-Stellung, Kopf/Pfote auflegen, Imponierpinkeln, -scharren.",k:["Stärke zeigen / beeindrucken","Ziel: Kampf vermeiden","mindestens zwei Beispiele","kann in Drohen übergehen"]},
// ---------------- ERGÄNZUNG: WELPEN UND SOZIALVERHALTEN ----------------
{c:"welpen",t:"mc",q:"Bis wann dauert die neonatale Phase?",o:["Bis zum 13. Tag","Bis zur 7. Woche","Bis zum 3. Tag","Bis zur 12. Woche"],a:[0],e:"Übergangsphase 14. – 21. Tag, Sozialisationsphase ab dem 21. Tag."},
{c:"welpen",t:"mc",q:"Ab wann beginnt die sekundäre Sozialisation?",o:["Ab der 7. Lebenswoche","Ab dem 14. Tag","Ab der 16. Woche","Ab der Geschlechtsreife"],a:[0],e:"Primäre Sozialisation 3. – 7. Woche. Die Sozialisationsphase läuft ab ca. der 12./14. Woche aus."},
{c:"welpen",t:"mc",q:"Warum sollte man Welpen in der neonatalen Phase nicht pauschal an die Zitze anlegen?",o:["Bei der Suche nach der Milchquelle machen sie erste Erfahrungen mit Belohnung durch Erfolg","Weil die Milch dann sauer wird","Weil die Welpen sonst nicht schlafen","Weil es gesetzlich verboten ist"],a:[0],e:"Lernen durch Erfolg und Misserfolg. Einem schwachen Welpen hilft man natürlich."},
{c:"welpen",t:"multi",q:"Welche Sinne sind in der neonatalen Phase schon vorhanden? (mehrere richtig)",o:["Geschmackssinn","Geruchssinn","Tast- und Temperatursinn","Gleichgewichtssinn","Sehen und Hören"],a:[0,1,2,3],e:"Welpen sind blind und taub und regeln ihre Körpertemperatur noch nicht selbst."},
{c:"welpen",t:"mc",q:"Ein Welpe ist in der neonatalen Phase zu kalt. Was tut er?",o:["Er bewegt sich reflexartig, bis er Mutter oder Geschwister findet","Er zittert und reguliert die Temperatur selbst","Er bellt","Nichts, Kälte merkt er noch nicht"],a:[0],e:"Eigene Wärmeregulation erst ab ca. 3 Wochen."},
{c:"welpen",t:"mc",q:"Was geschieht in der Übergangsphase im Hinblick auf die Stubenreinheit?",o:["Prägung auf den Untergrund zum Lösen","Nichts, Stubenreinheit beginnt erst mit 1 Jahr","Die Welpen lösen sich nur noch auf Signal","Die Mutter hört auf, die Welpen zu säubern"],a:[0],e:"Außerdem: Augen und Gehörgang öffnen sich, Fortbewegung entwickelt sich, die eigene Temperaturregulation beginnt."},
{c:"welpen",t:"mc",q:"Welche Rolle hat die Hündin in der primären Sozialisation?",o:["„Secure base“: erste intensive Bindung als Basis für weiteres Lernen","Sie bestraft jedes Fehlverhalten","Keine, Welpen lernen nur vom Menschen","Sie bringt ihm Kommandos bei"],a:[0],e:"Fundamente für weitere Lernprozesse; erste Kontakte mit einer engen „Welt“."},
{c:"welpen",t:"mc",q:"Bis wann steigt die Neugier der Welpen auf Menschen?",o:["Bis ca. zur 5. Woche, dann fällt sie wieder ab","Bis zum 1. Lebensjahr","Bis zur 14. Woche","Sie steigt immer weiter"],a:[0],e:"Ab der 3. Woche nähern sich Welpen dem Menschen; ab der 5. Woche Angst vor Unbekanntem."},
{c:"welpen",t:"mc",q:"Was soll bei der Habituation von Welpen beachtet werden?",o:["So viele Eindrücke wie möglich – ohne zu überfordern","Möglichst keine Reize, damit der Welpe ruhig bleibt","Nur laute, erschreckende Reize","Erst nach der 16. Woche beginnen"],a:[0],e:"Alles, was nicht „normal“ ist, führt später zu Angstverhalten. Beispiel: „Welpenabenteuergarten“ beim Züchter."},
{c:"welpen",t:"mc",q:"In welcher Phase lernt der Welpe Frustrationstoleranz?",o:["In der Abstillphase","In der neonatalen Phase","Erst im Erwachsenenalter","Gar nicht"],a:[0],e:"Folie Habituation."},
{c:"welpen",t:"multi",q:"Was gehört zu einer reizvollen Umwelt beim Züchter? (mehrere richtig)",o:["Verschiedene Untergründe","Wasser","Wackelnde Untergründe","Immer neue Geruchseindrücke","Ein kahler Zwinger ohne Rückzug"],a:[0,1,2,3],e:"Schult Gleichgewicht und Tastsinn, fördert die Gehirnentwicklung und das Selbstbewusstsein."},
{c:"welpen",t:"mc",q:"Was gilt für negative Erlebnisse in der Sozialisationsphase?",o:["Sie wirken viel stärker als im späteren Leben – milder Stress muss aber sein","Sie haben keine Wirkung","Je stärker, desto besser für den Welpen","Sie wirken genauso wie später"],a:[0],e:"Folie „Beachten“."},
{c:"welpen",t:"mc",q:"Warum sind kahle Zwinger ohne Rückzugsmöglichkeit für die Welpenentwicklung schlecht?",o:["Fluchtverhalten und Beschwichtigung können sich ohne Rückzugsmöglichkeit nicht ausbilden","Weil Welpen dort zu viel schlafen","Weil sie dann zu schnell wachsen","Kahle Zwinger sind ideal für Hygiene"],a:[0],e:"Bei Angst haben Hunde vier Möglichkeiten: Fliehen, Beschwichtigen, Erstarren, Kämpfen."},
{c:"welpen",t:"mc",q:"Ist das Erkennen der Signale anderer Hunde angeboren?",o:["Nein, nur ein Basis-Repertoire; Kommunikation muss mit anderen Hunden gelernt werden","Ja, vollständig","Nur bei Rassehunden","Nur bei Hündinnen"],a:[0],e:"Auch die Ausdrucksformen unterschiedlicher Rassen müssen gelernt werden; die Übung nach der 8. Woche fortsetzen."},
{c:"welpen",t:"mc",q:"Was zeigen Untersuchungen an freilebenden Haushunden?",o:["Eher lose Verbände, kaum Hierarchien, kaum Kooperation bei der Welpenaufzucht","Strenge Rudel wie bei wilden Wölfen","Feste Alpha-Paare","Lebenslange Familienrudel"],a:[0],e:"Statt „Rudel“ besser Gruppe oder Verband."},
{c:"welpen",t:"mc",q:"Warum gelten auf der Hundewiese keine Prinzipien des Rudelverhaltens?",o:["Die Hunde sind nicht verwandt, leben nicht zusammen und die Zusammensetzung wechselt","Weil dort nur Welpen sind","Weil die Hunde angeleint sind","Doch, dort gilt eine feste Rangordnung"],a:[0],e:"Fremde Tiere können jederzeit dazukommen."},
{c:"welpen",t:"mc",q:"Woraus wurde die alte Dominanztheorie ursprünglich entwickelt?",o:["Aus der Hackordnung der Hühner","Aus Studien an freilebenden Hunden","Aus der Arbeit von Hundeschulen","Aus der Beobachtung von Katzen"],a:[0],e:"Später als Prinzip auf andere Tiergruppen übertragen (Alpha, Beta, Omega)."},
{c:"welpen",t:"mc",q:"Ein Trainer sagt: „Ihr Hund zieht an der Leine, weil er Sie dominieren will.“ Wie ist das nach heutigem Wissen zu bewerten?",o:["Falsch – Lernprozesse (v. a. in Bezug auf Ressourcen) erklären das Verhalten besser","Richtig, Leinenziehen ist ein Rangordnungsproblem","Richtig, der Halter muss mehr „Alpha“ sein","Richtig, man sollte den Hund unterwerfen"],a:[0],e:"Das alte Dominanzprinzip hilft nicht bei der Erklärung von Problemen zwischen Hund und Mensch."},
{c:"welpen",t:"multi",q:"Wovon können Dominanzverhältnisse abhängen? (mehrere richtig)",o:["Tageszeit und Jahreszeit","Örtlichkeit","Interesse Einzelner an der Ressource","Frühere Erfahrungen mit der Situation","Nur vom Charakter des Hundes"],a:[0,1,2,3],e:"Außerdem Anzahl der Gruppenmitglieder, Gruppenstruktur, vorhandene Ressourcen und Stressoren."},
{c:"welpen",t:"multi",q:"Welche Ressourcen nennt die Folie bei den Statusverhältnissen? (mehrere richtig)",o:["Futter und Wasser","Territorium","Sozial- und Fortpflanzungspartner","Körperliche Unversehrtheit","Die Farbe des Halsbands"],a:[0,1,2,3],e:"Dominanz entscheidet über Zugriffsrechte auf Ressourcen."},
{c:"welpen",t:"mc",q:"Was zeigt die Körpersprache beim Knurren oft?",o:["Beschwichtigungssignale und Furcht – eher „ich trau dir nicht“ als eine Herausforderung","Immer eine selbstsichere Kampfansage","Freude","Hunger"],a:[0],e:"Wichtig: Vertrauen schaffen, statt Situationen eskalieren zu lassen."},
{c:"welpen",t:"multi",q:"Was gehört zu Management und Eigensicherung im Umgang mit einem Problemhund? (mehrere richtig)",o:["Situationen nicht eskalieren lassen","Maulkorb und Maulkorbtraining","Nicht zwanghaft und nicht allein handeln","Den Hund auf den Rücken drehen","Das Problem selbst wegtrainieren"],a:[0,1,2],e:"Angst- und Aggressionsprobleme gehören zu Fachpersonen (Tierarzt, entsprechend qualifizierte Trainer)."},
{c:"welpen",t:"mc",q:"Warum lässt sich das Verhalten heutiger Wölfe nicht einfach auf den Haushund übertragen?",o:["Durch Domestikation hat sich das Verhalten des Hundes nachweislich verändert","Weil Wölfe nicht sozial leben","Weil Hunde vom Fuchs abstammen","Doch, man kann es direkt übertragen"],a:[0],e:"Wir wissen auch nicht, wie sich der „Ur-Wolf“ verhalten hat."},
{c:"welpen",t:"open",q:"Was kann ein Züchter tun, damit sich Welpen gut entwickeln?",m:"Reizvolle Umwelt (verschiedene und wackelnde Untergründe, Wasser, Flatterbänder, Planen, Spielzeug, neue Gerüche), viele Eindrücke ohne Überforderung, Menschenkontakt ab der 3. Woche, Gewöhnung an Geräusche vor der 5. Woche, Rückzugsmöglichkeiten statt kahler Zwinger, milder Stress, Frustrationstoleranz in der Abstillphase.",k:["reizvolle Umwelt / Habituation","ohne Überforderung","früher Menschenkontakt","Rückzugsmöglichkeiten","milder Stress / Frustrationstoleranz"]},
{c:"welpen",t:"open",q:"Was bedeutet Dominanz im biologischen Sinn?",m:"Keine Charaktereigenschaft, sondern ein Verhältnis zwischen zwei Individuen, das über den Zugriff auf Ressourcen entscheidet. Es entsteht durch wiederholten Sozialkontakt und kann sich je nach Situation, Ort, Zeit und Ressource ändern.",k:["keine Charaktereigenschaft","Verhältnis zwischen 2 Individuen","Zugriff auf Ressourcen","veränderlich je nach Situation"]},

// ---------------- ERGÄNZUNG: RECHT ----------------
{c:"recht",t:"mc",q:"Innerhalb welcher Frist soll die Behörde über einen vollständigen Antrag nach § 11 entscheiden?",o:["Innerhalb von 4 Monaten","Innerhalb von 2 Wochen","Innerhalb von 2 Jahren","Es gibt keine Frist"],a:[0],e:"Bis zur schriftlichen Erlaubnis darf die Tätigkeit nicht beginnen."},
{c:"recht",t:"multi",q:"Was kennzeichnet „gewerbsmäßig“ im Sinne von § 11 Abs. 1 Nr. 8? (mehrere richtig)",o:["Selbstständig","Planmäßig","Fortgesetzt","Mit Gewinnabsicht","Nur mit Angestellten"],a:[0,1,2,3],e:"Gewerbsmäßigkeit ist nur bei den Tätigkeiten nach Nr. 8 Voraussetzung."},
{c:"recht",t:"mc",q:"Die Liste der erlaubnispflichtigen Tätigkeiten in § 11 Abs. 1 TierSchG ist …",o:["… abschließend","… nur beispielhaft, die Behörde kann Tätigkeiten ergänzen","… in jedem Bundesland anders","… nur für Tierheime gültig"],a:[0],e:"Prüfschema Schritt 2: Nennt § 11 diese Tätigkeit?"},
{c:"recht",t:"mc",q:"Unter welche Nummer des § 11 Abs. 1 fällt eine Tierpension?",o:["Je nach Behörde Nr. 3 oder Nr. 8a – eine Erlaubnis braucht sie immer","Nr. 8f","Nr. 5","Sie braucht keine Erlaubnis"],a:[0],e:"Nr. 3 = Tierheim oder ähnliche Einrichtung; Nr. 8a = gewerbsmäßig züchten oder halten."},
{c:"recht",t:"mc",q:"Sie haben eine Erlaubnis für eine Hundepension und ziehen an einen neuen Standort. Was gilt?",o:["Die Erlaubnis muss geändert bzw. neu erteilt werden","Die Erlaubnis gilt automatisch weiter","Man muss nur die Hundesteuer ummelden","Nichts, solange die Kunden dieselben bleiben"],a:[0],e:"Die Erlaubnis gilt nur für Leistungen, Tierarten, Standort und verantwortliche Personen, die darin stehen."},
{c:"recht",t:"mc",q:"Wie wird die persönliche Zuverlässigkeit für die Erlaubnis nach § 11 in der Regel belegt?",o:["Durch ein Führungszeugnis","Durch einen Hundeführerschein","Durch die Hundesteuerquittung","Durch den Mietvertrag"],a:[0],e:"Weitere Voraussetzungen: konkreter Antrag, Sachkunde, geeignete Räume und Einrichtungen, tragfähige Betriebsorganisation."},
{c:"recht",t:"mc",q:"Was verbietet § 3 Nr. 11 TierSchG?",o:["Geräte, die durch direkte Stromeinwirkung das artgemäße Verhalten erheblich einschränken oder zur Bewegung zwingen","Futterbelohnung im Training","Das Training mit Clicker","Brustgeschirre"],a:[0],e:"Weitere Verbote: Nr. 1 Überforderung, Nr. 3 Aussetzen, Nr. 5 Ausbildung mit erheblichen Schmerzen, Nr. 8a Ausbildung zu übersteigerter Aggression."},
{c:"recht",t:"mc",q:"Ein Halter lässt seinen Hund vor dem Urlaub an einer Raststätte zurück. Gegen welche Vorschrift verstößt er?",o:["§ 3 Nr. 3 TierSchG (Aussetzen oder Zurücklassen)","§ 90a BGB","§ 11 Abs. 1 Nr. 8f TierSchG","§ 834 BGB"],a:[0],e:"Aussetzen oder Zurücklassen, um sich des Tieres zu entledigen, ist verboten."},
{c:"recht",t:"mc",q:"Ein Trainer bildet einen Hund gezielt zu übersteigerter Aggressivität aus. Was gilt?",o:["Verboten nach § 3 Nr. 8a TierSchG – auch mit Erlaubnis nach § 11","Erlaubt mit Erlaubnis nach § 11","Erlaubt, wenn der Halter zustimmt","Nur in Großstädten verboten"],a:[0],e:"§ 11 erlaubt die Tätigkeit; §§ 1 – 3 bestimmen, wie sie ausgeübt werden darf."},
{c:"recht",t:"mc",q:"Was verbietet § 11b TierSchG?",o:["Qualzucht","Den Import von Hunden","Die Hundesteuer","Die Kastration"],a:[0],e:"§ 11a: Aufzeichnungspflichten. § 10 TierSchHuV ⚑: Ausstellungsverbot für Hunde mit amputierten Körperteilen oder Qualzuchtmerkmalen."},
{c:"recht",t:"mc",q:"Was kann die Behörde nach § 16a TierSchG anordnen?",o:["Maßnahmen bis zur Wegnahme der Tiere und zum Haltungsverbot","Nur eine Geldstrafe","Eine Freiheitsstrafe","Nichts, das darf nur ein Gericht"],a:[0],e:"§ 16 Überwachung durch die Behörde · § 20 gerichtliches Verbot der Tierhaltung."},
{c:"recht",t:"mc",q:"Was ist ein „Schaden“ im Sinne des Tierschutzgesetzes?",o:["Eine nachteilige Veränderung körperlicher oder psychischer Funktionen","Jede kurze unangenehme Empfindung","Ein Sachschaden am Eigentum des Halters","Nur eine offene Wunde"],a:[0],e:"Schmerz = unangenehme körperliche Empfindung; Leiden = weitergehende Beeinträchtigung des Wohlbefindens."},
{c:"recht",t:"multi",q:"Wonach wird bewertet, ob Schmerzen, Leiden oder Schäden tierschutzwidrig sind? (mehrere richtig)",o:["Intensität","Dauer","Wiederholung","Zweck und mildere Mittel","Kaufpreis des Hundes"],a:[0,1,2,3],e:"Niemand darf einem Tier ohne vernünftigen Grund Schmerzen, Leiden oder Schäden zufügen."},
{c:"recht",t:"mc",q:"Was ist der Zweck des Tierschutzgesetzes nach § 1 Satz 1?",o:["Aus der Verantwortung des Menschen für das Tier als Mitgeschöpf dessen Leben und Wohlbefinden schützen","Den Wert des Tieres als Eigentum schützen","Die Hundezucht fördern","Die Hundesteuer regeln"],a:[0],e:"§ 1 Satz 2: keine Schmerzen, Leiden oder Schäden ohne vernünftigen Grund."},
{c:"recht",t:"multi",q:"Welche Pflichten nennt § 2 TierSchG für Halter und Betreuer? (mehrere richtig)",o:["Das Tier angemessen ernähren, pflegen und verhaltensgerecht unterbringen","Die artgemäße Bewegung nicht so einschränken, dass Schmerzen, vermeidbare Leiden oder Schäden entstehen","Die nötigen Kenntnisse und Fähigkeiten haben","Das Tier jährlich impfen lassen","Den Hund haftpflichtversichern"],a:[0,1,2],e:"„Betreuen“ umfasst auch die vorübergehende Betreuung, also auch Dogsitter."},
{c:"recht",t:"mc",q:"Darf § 11 TierSchG die Berufsfreiheit (Art. 12 GG) einschränken?",o:["Ja, weil der Tierschutz als Staatsziel (Art. 20a GG) den Staat verpflichtet","Nein, Grundrechte sind nie einschränkbar","Nur in Berlin","Nur für Tierheime"],a:[0],e:"Grundrecht berechtigt den Einzelnen, Staatsziel verpflichtet den Staat."},
{c:"recht",t:"mc",q:"Welche Zwingerfläche braucht ein Hund mit 70 cm Widerristhöhe mindestens?",o:["10 m²","6 m²","8 m²","4 m²"],a:[0],e:"Bis 50 cm: 6 m² · über 50 bis 65 cm: 8 m² · über 65 cm: 10 m²."},
{c:"recht",t:"mc",q:"Zwei Hunde mit je 45 cm Widerristhöhe leben in einem Zwinger. Wie groß muss er mindestens sein?",o:["9 m²","6 m²","12 m²","8 m²"],a:[0],e:"Erster Hund 6 m², jeder weitere Hund + ½ der Fläche (3 m²) = 9 m² (§ 6 Abs. 2 TierSchHuV)."},
{c:"recht",t:"mc",q:"Was muss eine Schutzhütte für einen im Freien gehaltenen Hund erfüllen?",o:["Wärmedämmend, gesundheitsunschädlich, der Hund bleibt trocken und kann sich darin bewegen und liegen","Ein Dach reicht, Wände sind nicht nötig","Sie muss immer beheizt sein","Sie ist nur für Welpen vorgeschrieben"],a:[0],e:"§ 4 TierSchHuV ⚑. Außerhalb der Hütte zusätzlich ein witterungsgeschützter, schattiger, wärmegedämmter Liegeplatz."},
{c:"recht",t:"mc",q:"Ein Hund wird in einem Raum gehalten, der nicht für Menschen bestimmt ist. Wie groß muss die Fensterfläche in der Regel mindestens sein?",o:["1/8 der Bodenfläche","1/2 der Bodenfläche","1/20 der Bodenfläche","Es braucht kein Fenster"],a:[0],e:"§ 5 TierSchHuV ⚑. Gilt nicht, wenn der Hund ständig Zugang zu einem Auslauf im Freien hat."},
{c:"recht",t:"mc",q:"Wann muss beim Züchter spätestens eine Wurfkiste bereitstehen?",o:["3 Tage vor der zu erwartenden Geburt","Am Tag der Geburt","2 Wochen nach der Geburt","Es gibt keine Pflicht"],a:[0],e:"§ 3 TierSchHuV ⚑. Welpen in Räumen: ab 5 Wochen mindestens 1× täglich Auslauf im Freien."},
{c:"recht",t:"mc",q:"Für wie viele Zuchthunde (mit ihren Welpen) braucht ein gewerbsmäßiger Züchter jeweils eine sachkundige Betreuungsperson?",o:["Bis zu 5","Bis zu 20","Bis zu 2","Keine Vorgabe"],a:[0],e:"§ 3 Abs. 5 TierSchHuV ⚑."},
{c:"recht",t:"mc",q:"Was gilt für stromführende Vorrichtungen in einem Zwinger?",o:["Bis zu der Höhe, die der aufgerichtete Hund mit den Vorderpfoten erreicht, sind sie verboten","Sie sind erlaubt, wenn der Strom schwach ist","Sie sind erlaubt, um Ausbrechen zu verhindern","Es gibt keine Regel"],a:[0],e:"§ 6 Abs. 4 TierSchHuV ⚑. Die Einfriedung muss gesundheitsunschädlich sein; der Hund darf sie nicht überwinden und sich nicht verletzen."},
{c:"recht",t:"mc",q:"Ein Hund bleibt ohne Betreuung im Auto, während Sie einkaufen. Was verlangt die TierSchHuV?",o:["Ausreichende Frischluftversorgung und angemessene Temperatur sicherstellen","Nichts, solange es unter 1 Stunde dauert","Die Fenster müssen geschlossen sein","Der Hund muss angebunden sein"],a:[0],e:"§ 8 TierSchHuV. Hitze im Auto ist lebensgefährlich: Hunde geben Wärme fast nur über Hecheln ab."},
{c:"recht",t:"mc",q:"Wie oft muss Kot aus der Unterbringung entfernt werden?",o:["Täglich","Einmal pro Woche","Einmal im Monat","Nur wenn es riecht"],a:[0],e:"§ 8 TierSchHuV: Unterbringung mindestens 2× täglich kontrollieren, Mängel sofort abstellen."},
{c:"recht",t:"mc",q:"Ein Hund wird einzeln gehalten. Was verlangt die TierSchHuV?",o:["Mehrmals täglich länger dauernden Umgang mit Menschen","Einmal pro Woche Kontakt","Nichts Besonderes","Zwingend einen zweiten Hund"],a:[0],e:"§ 2 TierSchHuV. Auslauf und Sozialkontakte an Rasse, Alter und Gesundheit anpassen."},
{c:"recht",t:"mc",q:"Was sieht die Tierheimordnung des Deutschen Tierschutzbundes zur Gruppenhaltung vor?",o:["Gruppenhaltung, wann immer möglich – zumindest tagsüber","Nur Einzelhaltung","Gruppenhaltung nur nachts","Nichts"],a:[0],e:"Sie ist kein Gesetz; verbindlich für alle ist die TierSchHuV. Auf Stressreduktion und Sozialbedürfnis achten."},
{c:"recht",t:"multi",q:"Was gehört zu einer nicht-kommerziellen Heimtierreise in der EU? (mehrere richtig)",o:["Halter oder ermächtigte Person reist mit","Kein Verkauf / kein Eigentumswechsel","Chip, gültige Tollwutimpfung, EU-Heimtierausweis","Registrierung als Händler und Gesundheitsbescheinigung"],a:[0,1,2],e:"Bei Verkauf oder Eigentumswechsel: kommerzielle Verbringung (Registrierung, Gesundheitsbescheinigung, Meldung)."},
{c:"recht",t:"multi",q:"Was gehört zum Aufnahmecheck eines Hundes in der Pension? (mehrere richtig)",o:["Chip auslesen und mit dem Dokument abgleichen","Halter und Notfallkontakt notieren","Impfungen prüfen","Den Gasthund zur Hundesteuer anmelden"],a:[0,1,2],e:"Ein Pensionshund wird durch den vorübergehenden Aufenthalt nicht steuerpflichtig für den Betreiber."},
{c:"recht",t:"mc",q:"Kennzeichnung, Registrierung, Anzeige und Hundesteuer sind …",o:["… verschiedene Pflichten","… dasselbe","… alle durch den Chip erfüllt","… nur für Züchter relevant"],a:[0],e:"Der Chip ersetzt z. B. weder die Anmeldung zur Hundesteuer noch eine Registrierung."},
{c:"recht",t:"mc",q:"Eine Mitarbeiterin der Pension verursacht einen Schaden grob fahrlässig. Wer trägt ihn im Innenverhältnis in der Regel?",o:["Grundsätzlich die Mitarbeiterin","Immer allein der Betrieb","Der Kunde","Die Gemeinde"],a:[0],e:"Leichte Fahrlässigkeit → Betrieb · mittlere → Teilung · grobe → grundsätzlich Arbeitnehmer."},
{c:"recht",t:"mc",q:"Was deckt eine Tierkrankenversicherung?",o:["Behandlungskosten des eigenen Tieres","Schäden, die der Hund Dritten zufügt","Schäden an fremden Hunden in Obhut","Die Hundesteuer"],a:[0],e:"Tierhalterhaftpflicht: eigene Tiere · Betriebs- und Tierhüterhaftpflicht: fremde Tiere in Obhut."},
{c:"recht",t:"open",q:"Nennen Sie die vier Schritte des Prüfschemas, ob eine Erlaubnis nach § 11 nötig ist.",m:"1. Was geschieht tatsächlich mit welchem Tier? 2. Nennt § 11 Abs. 1 diese Tätigkeit (abschließende Liste)? 3. Ist Gewerbsmäßigkeit erforderlich (nur bei Nr. 8)? 4. Welchen Umfang braucht die Erlaubnis (Leistungen, Tierarten, Standort, verantwortliche Personen)?",k:["tatsächliche Tätigkeit + Tierart","in § 11 Abs. 1 genannt","Gewerbsmäßigkeit nur bei Nr. 8","Umfang der Erlaubnis"]},
{c:"recht",t:"open",q:"Was prüfen Sie beim Aufnahmecheck eines Pensionshundes?",m:"Chip auslesen und mit dem Heimtierausweis abgleichen, Halter- und Notfallkontakt aufnehmen, Impfungen prüfen (eigene Impfanforderungen der Pension möglich), offene Punkte klären; bei Abweichungen dokumentieren und den Halter informieren.",k:["Chip + Dokument abgleichen","Halter / Notfallkontakt","Impfungen","Abweichungen dokumentieren"]}
];

</script>
<script>
(function(){
  "use strict";
  Q.forEach(function(q,i){ q.id = q.c + "-" + i; });
  const byId = {}; Q.forEach(function(q){ byId[q.id]=q; });
  const EXAM = new Date("2026-11-23T10:30:00+01:00");
  const $ = function(id){ return document.getElementById(id); };
  const esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); };

  // ---- storage (optional) ----
  const KEY = "skn11-quiz-v1";
  function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"{}"); return {wrong:s.wrong||[], last:s.last??null}; }catch(e){ return {wrong:[],last:null}; } }
  function save(st){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  let store = load();
  store.wrong = store.wrong.filter(function(id){ return byId[id]; });

  // ---- helpers ----
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function show(v){ ["v-start","v-quiz","v-result"].forEach(function(x){ $(x).classList.toggle("hidden", x!==v); }); window.scrollTo(0,0); }

  // ---- start screen ----
  const selected = new Set(Object.keys(CATS));
  function renderStart(){
    const days = Math.ceil((EXAM - new Date())/86400000);
    $("countdown").textContent = days > 1 ? (days + " giorni all'esame") : days === 1 ? "Esame domani" : days === 0 ? "Esame oggi" : "Esame passato";
    $("s-total").textContent = Q.length;
    $("s-wrong").textContent = store.wrong.length;
    $("s-last").textContent = store.last == null ? "–" : store.last + " %";
    $("m-err").disabled = store.wrong.length === 0;
    $("m-err-p").textContent = store.wrong.length ? ("Hai " + store.wrong.length + " domande sbagliate da rifare. Escono dalla lista quando rispondi giusto.") : "Nessun errore salvato per ora: fai prima un allenamento o una simulazione.";
    const box = $("chips"); box.innerHTML = "";
    Object.keys(CATS).forEach(function(k){
      const n = Q.filter(function(q){ return q.c===k; }).length;
      const lab = document.createElement("label");
      lab.className = "chip" + (selected.has(k) ? " on" : "");
      lab.innerHTML = '<input type="checkbox" id="c-'+k+'" '+(selected.has(k)?"checked":"")+'> '+esc(CATS[k])+' <small>'+n+'</small>';
      lab.querySelector("input").addEventListener("change", function(e){ if(e.target.checked) selected.add(k); else selected.delete(k); lab.classList.toggle("on", e.target.checked); $("m-train").disabled = selected.size===0; });
      box.appendChild(lab);
    });
    $("m-train").disabled = selected.size===0;
  }
  $("all-btn").addEventListener("click", function(){ if(selected.size===Object.keys(CATS).length){ selected.clear(); } else { Object.keys(CATS).forEach(function(k){ selected.add(k); }); } renderStart(); });

  // ---- session ----
  let S = null, timerId = null;
  function start(list, mode){
    S = {mode:mode, list:list, i:0, answers:[], checked:false, sel:new Set(), end: mode==="sim" ? Date.now()+60*60000 : null};
    show("v-quiz");
    $("timer").classList.toggle("hidden", mode!=="sim");
    clearInterval(timerId);
    if(mode==="sim"){ tick(); timerId = setInterval(tick, 1000); }
    renderQ();
  }
  function tick(){
    const left = Math.max(0, S.end - Date.now());
    const m = Math.floor(left/60000), s = Math.floor(left/1000)%60;
    $("timer").textContent = "⏱ " + m + ":" + String(s).padStart(2,"0");
    $("timer").classList.toggle("low", left < 5*60000);
    if(left===0){ clearInterval(timerId); finish(); }
  }

  $("m-sim").addEventListener("click", function(){
    const mc = shuffle(Q.filter(function(q){ return q.t!=="open"; }));
    // balanced draw: at least 2 per category, rest random
    const pick = []; const used = new Set();
    Object.keys(CATS).forEach(function(k){ mc.filter(function(q){return q.c===k;}).slice(0, k==="recht"?5:2).forEach(function(q){ pick.push(q); used.add(q.id); }); });
    mc.forEach(function(q){ if(pick.length<30 && !used.has(q.id)){ pick.push(q); used.add(q.id); } });
    const op = shuffle(Q.filter(function(q){ return q.t==="open"; })).slice(0,5);
    start(shuffle(pick.slice(0,30)).concat(op), "sim");
  });
  $("m-train").addEventListener("click", function(){
    let pool = Q.filter(function(q){ return selected.has(q.c) && ($("open-chk").checked || q.t!=="open"); });
    const n = +$("n-sel").value; pool = shuffle(pool); if(n) pool = pool.slice(0,n);
    if(!pool.length) return; start(pool, "train");
  });
  $("m-err").addEventListener("click", function(){ const pool = shuffle(store.wrong.map(function(id){ return byId[id]; })); if(pool.length) start(pool, "train"); });
  $("quit").addEventListener("click", function(){ if(S.answers.length) finish(); else { clearInterval(timerId); renderStart(); show("v-start"); } });

  function renderQ(){
    const q = S.list[S.i]; S.checked=false; S.sel=new Set();
    $("q-count").textContent = "Domanda " + (S.i+1) + " di " + S.list.length;
    $("q-bar").style.width = (S.i / S.list.length * 100) + "%";
    const c = $("q-card");
    let h = '<span class="tag">'+esc(CATS[q.c])+(q.t==="open"?" · domanda aperta":"")+'</span><p class="q">'+esc(q.q)+'</p>';
    if(q.t==="multi") h += '<div class="hint">Più risposte corrette – seleziona tutte quelle giuste.</div>';
    if(q.t==="open"){
      h += '<label class="small" for="ans">Scrivi la risposta in tedesco, senza guardare gli appunti.</label><textarea id="ans" placeholder="Antwort …"></textarea><div id="openfb"></div>';
    } else {
      if(!q._order) q._order = shuffle(q.o.map(function(_,i){return i;}));
      h += '<div class="opts">' + q._order.map(function(oi,pos){ return '<button type="button" class="opt'+(q.t==="multi"?" multi":"")+'" data-oi="'+oi+'"><span class="k">'+(pos+1)+'</span><span>'+esc(q.o[oi])+'</span></button>'; }).join("") + '</div><div id="mcfb"></div>';
    }
    h += '<div class="actions"><span></span><button class="btn" type="button" id="next"></button></div>';
    c.innerHTML = h;
    q._order = null;
    c.querySelectorAll(".opt").forEach(function(b){ b.addEventListener("click", function(){ pick(+b.dataset.oi); }); });
    updateNextBtn();
    $("next").addEventListener("click", next);
    const ta = $("ans"); if(ta) ta.addEventListener("input", updateNextBtn);
  }
  function pick(oi){
    if(S.checked) return;
    const q = S.list[S.i];
    if(q.t==="multi"){ if(S.sel.has(oi)) S.sel.delete(oi); else S.sel.add(oi); }
    else { S.sel = new Set([oi]); }
    $("q-card").querySelectorAll(".opt").forEach(function(b){ b.classList.toggle("sel", S.sel.has(+b.dataset.oi)); });
    updateNextBtn();
  }
  function updateNextBtn(){
    const q = S.list[S.i], b = $("next"); if(!b) return;
    const last = S.i === S.list.length-1;
    if(q.t==="open"){
      if(!S.checked){ b.textContent = "Mostra la soluzione"; b.disabled = false; }
      else { b.textContent = last ? "Vedi il risultato" : "Avanti →"; b.disabled=false; }
    } else if(S.mode==="sim"){
      b.textContent = last ? "Vedi il risultato" : "Avanti →"; b.disabled = S.sel.size===0;
    } else {
      b.textContent = S.checked ? (last ? "Vedi il risultato" : "Avanti →") : "Controlla"; b.disabled = !S.checked && S.sel.size===0;
    }
  }
  function sameSet(a,b){ if(a.size!==b.length) return false; return b.every(function(x){ return a.has(x); }); }

  function next(){
    const q = S.list[S.i];
    if(q.t==="open"){
      if(!S.checked){ revealOpen(q); return; }
      const boxes = Array.from(document.querySelectorAll("#openfb input"));
      const got = boxes.filter(function(x){return x.checked;}).length;
      S.answers.push({q:q, score: boxes.length ? got/boxes.length : 0, text: $("ans").value, missed: q.k.filter(function(_,i){ return !boxes[i].checked; })});
      return advance();
    }
    if(S.mode==="sim"){
      S.answers.push({q:q, score: sameSet(S.sel,q.a)?1:0, sel:Array.from(S.sel)});
      return advance();
    }
    if(!S.checked){ checkMC(q); return; }
    advance();
  }
  function checkMC(q){
    S.checked = true;
    const ok = sameSet(S.sel, q.a);
    $("q-card").querySelectorAll(".opt").forEach(function(b){
      const oi=+b.dataset.oi; b.disabled=true;
      if(q.a.indexOf(oi)>=0) b.classList.add("right"); else if(S.sel.has(oi)) b.classList.add("wrong");
      b.classList.remove("sel");
    });
    $("mcfb").innerHTML = '<div class="fb '+(ok?"ok":"no")+'"><b class="v">'+(ok?"Giusto.":"Sbagliato.")+'</b> '+esc(q.e)+'</div>';
    S.answers.push({q:q, score: ok?1:0, sel:Array.from(S.sel)});
    updateNextBtn();
  }
  function revealOpen(q){
    S.checked = true;
    $("ans").readOnly = true;
    $("openfb").innerHTML = '<div class="model"><h4>Risposta modello</h4>'+esc(q.m)+'</div><div class="model" style="background:transparent;border:1px solid var(--line)"><h4>Spunta i punti che hai scritto</h4><div class="checks">'+q.k.map(function(k,i){ return '<label for="k'+i+'"><input type="checkbox" id="k'+i+'"> '+esc(k)+'</label>'; }).join("")+'</div></div>';
    updateNextBtn();
  }
  function advance(){
    // update error list
    const a = S.answers[S.answers.length-1];
    const idx = store.wrong.indexOf(a.q.id);
    if(a.score < 1 && idx<0) store.wrong.push(a.q.id);
    if(a.score === 1 && idx>=0) store.wrong.splice(idx,1);
    save(store);
    if(S.i < S.list.length-1){ S.i++; renderQ(); } else finish();
  }

  function finish(){
    clearInterval(timerId);
    const ans = S.answers;
    const total = ans.length;
    const pts = ans.reduce(function(s,a){ return s+a.score; },0);
    const denom = S.mode==="sim" ? S.list.length : total;
    const pct = denom ? Math.round(pts/denom*100) : 0;
    const PASS = 70;
    if(S.mode==="sim"){ store.last = pct; save(store); }
    $("r-pct").textContent = pct + " %";
    $("r-title").textContent = S.mode==="sim" ? (pct>=PASS ? "Superata (soglia 70 %)" : "Non superata (soglia 70 %)") : ("Allenamento finito · " + (pct>=PASS ? "sopra" : "sotto") + " il 70 %");
    $("r-pct").style.color = pct>=PASS ? "var(--good)" : "var(--bad)";
    const missedCount = ans.filter(function(a){return a.score<1;}).length;
    $("r-sub").textContent = (Math.round(pts*10)/10).toString().replace(".",",") + " punti su " + total + " domande risposte" + (total < S.list.length ? " (su " + S.list.length + ")" : "") + " · " + missedCount + " da rivedere";
    // per category
    const per = {};
    ans.forEach(function(a){ const k=a.q.c; per[k]=per[k]||{p:0,n:0}; per[k].p+=a.score; per[k].n++; });
    $("r-cats").innerHTML = Object.keys(CATS).filter(function(k){return per[k];}).map(function(k){
      const v = Math.round(per[k].p/per[k].n*100);
      const col = v>=80 ? "var(--good)" : v>=50 ? "var(--warn)" : "var(--bad)";
      return '<div class="cat"><span>'+esc(CATS[k])+'</span><span class="track"><i style="width:'+v+'%;background:'+col+'"></i></span><em>'+v+' %</em></div>';
    }).join("");
    // review
    const rev = ans.filter(function(a){ return a.score<1; });
    $("r-rev-h").classList.toggle("hidden", !rev.length);
    $("r-again").disabled = !rev.length;
    $("r-review").innerHTML = rev.map(function(a){
      const q=a.q;
      if(q.t==="open"){
        return '<div class="rv part"><span class="tag">'+esc(CATS[q.c])+' · aperta · '+Math.round(a.score*100)+' %</span><p><b>'+esc(q.q)+'</b></p>'+(a.text?'<p class="lbl">La tua risposta</p><p>'+esc(a.text)+'</p>':'')+'<p class="lbl">Punti mancanti</p><p>'+esc(a.missed.join(" · "))+'</p><p class="lbl">Risposta modello</p><p>'+esc(q.m)+'</p></div>';
      }
      const yours = a.sel && a.sel.length ? a.sel.map(function(i){return q.o[i];}).join(" · ") : "nessuna";
      return '<div class="rv"><span class="tag">'+esc(CATS[q.c])+'</span><p><b>'+esc(q.q)+'</b></p><p class="lbl">La tua risposta</p><p>'+esc(yours)+'</p><p class="lbl">Corretta</p><p>'+esc(q.a.map(function(i){return q.o[i];}).join(" · "))+'</p><p class="small">'+esc(q.e)+'</p></div>';
    }).join("");
    S.review = rev.map(function(a){return a.q;});
    show("v-result");
  }
  $("r-again").addEventListener("click", function(){ if(S && S.review && S.review.length) start(shuffle(S.review), "train"); });
  $("r-home").addEventListener("click", function(){ renderStart(); show("v-start"); });

  // keyboard
  document.addEventListener("keydown", function(e){
    if($("v-quiz").classList.contains("hidden")) return;
    if(e.target.tagName==="TEXTAREA") return;
    const n = parseInt(e.key,10);
    if(n>=1 && n<=9){ const b = document.querySelectorAll(".opt")[n-1]; if(b && !b.disabled) b.click(); }
    if(e.key==="Enter"){ const b=$("next"); if(b && !b.disabled){ e.preventDefault(); b.click(); } }
  });

  renderStart();
})();
</script>
</body>
</html>
