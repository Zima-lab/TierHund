<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Sachkunde § 11 Hund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: one centred working column (max 760px); start screen = modes + topic filter, quiz = one question per card, results = summary then review list. */
:root{
  --bg:#f3f5f3;
  --surface:#ffffff;
  --ink:#17201c;
  --muted:#5d6b64;
  --line:#d9e0dc;
  --accent:#1f5c4a;
  --accent-soft:#e3eee9;
  --good:#1e7a46; --good-soft:#e2f3e8;
  --bad:#b3261e; --bad-soft:#fbe6e4;
  --warn:#a5650a; --warn-soft:#fbefdc;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#1a211d; --ink:#e7ede9; --muted:#9aaba2; --line:#2d3832;
    --accent:#6fc4a4; --accent-soft:#1f3a30;
    --good:#6fd39a; --good-soft:#173826; --bad:#ff8c84; --bad-soft:#3d1c1a; --warn:#f2b45a; --warn-soft:#3a2a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --ink:#e7ede9; --muted:#9aaba2; --line:#2d3832;
  --accent:#6fc4a4; --accent-soft:#1f3a30;
  --good:#6fd39a; --good-soft:#173826; --bad:#ff8c84; --bad-soft:#3d1c1a; --warn:#f2b45a; --warn-soft:#3a2a12;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
.sub{color:var(--muted);margin-top:4px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.countdown{font-family:var(--display);font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:6px 12px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.modes{display:grid;gap:10px;margin-bottom:22px}
.mode{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;cursor:pointer;color:var(--ink);font:inherit}
.mode:hover{border-color:var(--accent)}
.mode:focus-visible,button:focus-visible,textarea:focus-visible,.chip:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.mode h2{grid-column:1}
.mode p{grid-column:1;margin:0;color:var(--muted);font-size:.92rem}
.mode .go{grid-column:2;grid-row:1/3;font-family:var(--display);font-weight:700;color:var(--accent)}
.mode[disabled]{opacity:.5;cursor:not-allowed;border-left-color:var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{font-size:1rem;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem;user-select:none;background:var(--bg)}
.chip input{accent-color:var(--accent);margin:0}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:14px}
.row label{display:inline-flex;gap:6px;align-items:center;font-size:.92rem}
select{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-family:var(--display);font-weight:700;border-radius:8px;padding:10px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:.9rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.timer{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.tag{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.02em;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 8px;margin-bottom:10px}
.q{font-size:1.12rem;font-weight:700;margin:0 0 6px}
.hint{color:var(--warn);font-size:.88rem;margin-bottom:10px;font-weight:700}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt .k{flex:none;width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt.multi .k{border-radius:4px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
textarea{width:100%;min-height:130px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.fb{border-radius:8px;padding:12px 14px;margin-top:4px}
.fb.ok{background:var(--good-soft);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb.part{background:var(--warn-soft);border-left:4px solid var(--warn)}
.fb b.v{font-family:var(--display)}
.model{background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin-top:12px}
.model h4{margin:0 0 6px;font-family:var(--display);font-size:.9rem;color:var(--accent)}
.checks{display:grid;gap:6px;margin-top:10px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:.95rem;cursor:pointer}
.checks input{accent-color:var(--accent);margin-top:4px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.cats{display:grid;gap:8px;margin:16px 0}
.cat{display:grid;grid-template-columns:minmax(120px,190px) 1fr 3.5em;gap:10px;align-items:center;font-size:.9rem}
.cat .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.cat .track i{display:block;height:100%}
.cat em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.review{display:grid;gap:10px;margin-top:12px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;font-size:.95rem}
.rv.part{border-left-color:var(--warn)}
.rv p{margin:4px 0}
.rv .lbl{color:var(--muted);font-size:.82rem}
.small{font-size:.85rem;color:var(--muted)}
.hidden{display:none !important}
kbd{font-family:inherit;font-size:.8rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:1.15rem}.cat{grid-template-columns:110px 1fr 3em}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Quiz Sachkunde § 11 – Hund</h1>
    <div class="sub">Esame IHK Potsdam · 23.11.2026 · domande in tedesco, come all'esame</div>
  </div>
  <div class="countdown" id="countdown"></div>
</header>

<!-- START -->
<section id="v-start">
  <div class="stats">
    <div class="stat"><b id="s-total">0</b><span>domande nel quiz</span></div>
    <div class="stat"><b id="s-wrong">0</b><span>errori da ripassare</span></div>
    <div class="stat"><b id="s-last">–</b><span>ultima simulazione</span></div>
  </div>

  <div class="modes">
    <button class="mode" id="m-sim" type="button">
      <h2>Simulazione d'esame</h2>
      <p>30 crocette + 5 domande aperte da tutti gli argomenti, 60 minuti. Correzione solo alla fine, come all'esame.</p>
      <span class="go">Inizia →</span>
    </button>
    <button class="mode" id="m-train" type="button">
      <h2>Allenamento</h2>
      <p>Argomenti scelti qui sotto. Correzione e spiegazione subito dopo ogni risposta.</p>
      <span class="go">Inizia →</span>
    </button>
    <button class="mode" id="m-err" type="button">
      <h2>Ripassa gli errori</h2>
      <p id="m-err-p">Le domande sbagliate in precedenza. Escono dalla lista quando rispondi giusto.</p>
      <span class="go">Inizia →</span>
    </button>
  </div>

  <div class="panel">
    <h3>Argomenti per l'allenamento</h3>
    <div class="chips" id="chips"></div>
    <div class="row">
      <label for="n-sel">Numero di domande
        <select id="n-sel"><option value="10">10</option><option value="20" selected>20</option><option value="40">40</option><option value="0">tutte</option></select>
      </label>
      <label for="open-chk"><input type="checkbox" id="open-chk" checked> includi domande aperte</label>
      <button class="btn ghost" type="button" id="all-btn">Tutti / nessuno</button>
    </div>
  </div>
  <p class="small" style="margin-top:14px">Tasti: <kbd>1</kbd>–<kbd>5</kbd> scegli la risposta · <kbd>Invio</kbd> controlla / avanti. I progressi restano solo in questo browser.</p>
</section>

<!-- QUIZ -->
<section id="v-quiz" class="hidden">
  <div class="top">
    <span id="q-count"></span>
    <span class="timer hidden" id="timer"></span>
    <button class="btn ghost" type="button" id="quit">Termina</button>
  </div>
  <div class="bar"><i id="q-bar" style="width:0"></i></div>
  <div class="card" id="q-card"></div>
</section>

<!-- RESULT -->
<section id="v-result" class="hidden">
  <div class="card">
    <div class="score"><b id="r-pct"></b><div><h2 id="r-title"></h2><div class="sub" id="r-sub"></div></div></div>
    <div class="cats" id="r-cats"></div>
    <div class="actions">
      <button class="btn" type="button" id="r-again">Ripassa gli errori di questo giro</button>
      <button class="btn ghost" type="button" id="r-home">Torna all'inizio</button>
    </div>
  </div>
  <h2 style="margin-top:24px" id="r-rev-h">Da rivedere</h2>
  <div class="review" id="r-review"></div>
</section>
</div>

<script>
// Fragenkatalog – Quellen: Kursfolien Rechtsvorschriften, Modul 2a, 2b, 2c. ⚑ = Gesetzestext, nicht in den Folien.
// t: "mc" (eine richtige Antwort), "multi" (mehrere richtig), "open" (offene Frage, Selbstbewertung)
const CATS = {
  recht: "Recht",
  rassen: "Rassen und Zucht",
  koerper: "Körper und Sinne",
  fort: "Fortpflanzung und Kastration",
  futter: "Fütterung",
  gesund: "Gesundheit",
  lernen: "Lernverhalten",
  sprache: "Körpersprache",
  welpen: "Welpen und Sozialverhalten"
};

const Q = [
// ---------------- RECHT ----------------
{c:"recht",t:"mc",q:"Was ist entscheidend dafür, ob eine Erlaubnis nach § 11 TierSchG nötig ist?",
 o:["Die tatsächlich ausgeübte Tätigkeit","Die Berufsbezeichnung","Der Name des Betriebs","Die Zahl der Mitarbeitenden"],a:[0],
 e:"Nicht der Berufsname entscheidet, sondern was tatsächlich mit welchen Tieren geschieht."},
{c:"recht",t:"mc",q:"Der Tierschutz in Art. 20a Grundgesetz ist …",
 o:["ein Staatsziel","ein Grundrecht","eine Ordnungswidrigkeit","eine Verordnung"],a:[0],
 e:"Art. 20a GG verpflichtet den Staat, die Tiere zu schützen: Staatsziel."},
{c:"recht",t:"mc",q:"Was ist der Unterschied zwischen Grundrecht und Staatsziel?",
 o:["Ein Grundrecht berechtigt den Einzelnen, ein Staatsziel verpflichtet den Staat","Ein Staatsziel berechtigt den Einzelnen, ein Grundrecht verpflichtet den Staat","Beide gelten nur im jeweiligen Bundesland","Es gibt keinen Unterschied"],a:[0],
 e:"MERKE: Ein Grundrecht berechtigt den Einzelnen (z. B. Art. 12 GG Berufsfreiheit). Ein Staatsziel verpflichtet den Staat."},
{c:"recht",t:"mc",q:"Mara hat den Antrag auf Erlaubnis gestellt und die IHK-Teilnahmebescheinigung. Wann darf sie die Tierpension eröffnen?",
 o:["Erst nach Erteilung der schriftlichen Erlaubnis","Sofort nach dem Antrag","Mit der Teilnahmebescheinigung","Mit einem Hundeführerschein"],a:[0],
 e:"Antrag, Teilnahmebescheinigung und Hundeführerschein ersetzen die Erlaubnis nicht (§ 11 Abs. 5)."},
{c:"recht",t:"mc",q:"Welche Nummer des § 11 Abs. 1 betrifft das gewerbsmäßige Ausbilden von Hunden für Dritte?",
 o:["Nr. 8f","Nr. 8a","Nr. 3","Nr. 5"],a:[0],
 e:"Nr. 8f: für Dritte Hunde ausbilden oder die Ausbildung durch den Tierhalter anleiten. 8a = züchten oder halten, 3 = Tierheim, 5 = Einfuhr/Vermittlung."},
{c:"recht",t:"mc",q:"Ein Verein holt Hunde aus dem Ausland und gibt sie gegen eine Schutzgebühr ab. Welche Erlaubnis ist zu prüfen?",
 o:["§ 11 Abs. 1 Nr. 5","§ 11 Abs. 1 Nr. 8f","§ 11 Abs. 1 Nr. 8c","Keine, weil es ein Verein ist"],a:[0],
 e:"Nr. 5: Wirbeltiere zur Abgabe gegen Entgelt oder sonstige Gegenleistung einführen oder vermitteln. Auch eine Schutzgebühr ist eine Gegenleistung."},
{c:"recht",t:"mc",q:"Welche Nummer betrifft das Halten von Tieren in einem Tierheim?",
 o:["Nr. 3","Nr. 4","Nr. 7","Nr. 8b"],a:[0],e:"§ 11 Abs. 1 Nr. 3: Tiere in einem Tierheim oder in einer ähnlichen Einrichtung halten."},
{c:"recht",t:"multi",q:"Welche Voraussetzungen gehören zur Erlaubnis nach § 11? (mehrere richtig)",
 o:["Sachkunde der verantwortlichen Person","Persönliche Zuverlässigkeit","Geeignete Räume und Einrichtungen","Ein Hundeführerschein","Ein Meisterbrief"],a:[0,1,2],
 e:"Konkreter Antrag, Sachkunde, Zuverlässigkeit, geeignete Räume und Einrichtungen, tragfähige Betriebsorganisation."},
{c:"recht",t:"multi",q:"Was muss die Erlaubnis nach § 11 erfassen? (mehrere richtig)",
 o:["Tierarten","Tätigkeiten / Leistungen","Standort","Verantwortliche Person","Hundesteuer"],a:[0,1,2,3],
 e:"Die Erlaubnis gilt nur für das, was drinsteht: Leistungen, Tierarten, Standort, verantwortliche Personen."},
{c:"recht",t:"mc",q:"Für welche Tätigkeiten ist „Gewerbsmäßigkeit“ eine Voraussetzung der Erlaubnispflicht?",
 o:["Nur für die Tätigkeiten nach Nr. 8","Für alle Nummern des § 11","Nur für Tierheime","Nur für Tierbörsen"],a:[0],
 e:"Schritt 3 des Prüfschemas stellt sich nur bei Nr. 8 (z. B. 8a, 8b, 8f)."},
{c:"recht",t:"mc",q:"Was sagt § 1 Satz 2 TierSchG?",
 o:["Niemand darf einem Tier ohne vernünftigen Grund Schmerzen, Leiden oder Schäden zufügen.","Jeder Hund braucht eine Erlaubnis.","Tiere sind Sachen.","Hunde müssen geimpft sein."],a:[0],
 e:"§ 1: Schutz von Leben und Wohlbefinden des Tieres als Mitgeschöpf."},
{c:"recht",t:"mc",q:"Für wen gelten die Pflichten aus § 2 TierSchG?",
 o:["Für jeden, der ein Tier hält, betreut oder zu betreuen hat","Nur für den Eigentümer","Nur für gewerbliche Betriebe","Nur für Züchter"],a:[0],
 e:"„Betreuen“ umfasst auch die vorübergehende Betreuung, also auch Dogsitter."},
{c:"recht",t:"mc",q:"Ein Trainer trainiert weiter, obwohl der Hund stark hechelt, langsamer wird und sich immer wieder hinlegt. Gegen welche Vorschrift verstößt er vor allem?",
 o:["§ 3 Nr. 1 TierSchG (Überforderung)","§ 11b TierSchG (Qualzucht)","§ 90a BGB","§ 7 TierSchHuV"],a:[0],
 e:"§ 3 Nr. 1: Leistungen abverlangen, denen das Tier offensichtlich nicht gewachsen ist. Zusätzlich Nr. 5 prüfen. Training abbrechen oder anpassen."},
{c:"recht",t:"mc",q:"Was verbietet § 3 Nr. 5 TierSchG?",
 o:["Ein Tier mit erheblichen Schmerzen, Leiden oder Schäden auszubilden oder zu trainieren","Ein Tier auszusetzen","Mit Tieren zu handeln","Hunde in Zwingern zu halten"],a:[0],
 e:"Nr. 5 = schädigendes Training. Nr. 3 = Aussetzen. Nr. 11 = Geräte mit direkter Stromeinwirkung."},
{c:"recht",t:"mc",q:"Was bedeutet „Leiden“ im Sinne des Tierschutzgesetzes?",
 o:["Eine weitergehende Beeinträchtigung des Wohlbefindens","Eine unangenehme körperliche Empfindung","Eine nachteilige Veränderung körperlicher Funktionen","Eine Krankheit, die der Tierarzt feststellt"],a:[0],
 e:"Schmerz = unangenehme körperliche Empfindung. Leiden = weitergehende Beeinträchtigung des Wohlbefindens. Schaden = nachteilige Veränderung körperlicher oder psychischer Funktionen."},
{c:"recht",t:"mc",q:"Welche Konsequenz droht nach § 18 TierSchG, wenn man ohne Erlaubnis nach § 11 arbeitet?",
 o:["Bußgeld bis 25.000 €","Freiheitsstrafe bis 10 Jahre","Nur eine Verwarnung","Keine, wenn der Antrag gestellt ist"],a:[0],
 e:"§ 18 = Ordnungswidrigkeit (Bußgeld bis 25.000 €). § 17 = Straftat (Freiheitsstrafe bis 3 Jahre oder Geldstrafe)."},
{c:"recht",t:"mc",q:"Was sagt § 90a BGB?",
 o:["Tiere sind keine Sachen, aber die Vorschriften für Sachen gelten entsprechend","Tiere sind Sachen","Tiere haben eigene Rechte wie Menschen","Tiere gehören dem Staat"],a:[0],
 e:"Folge: Die Verletzung eines Tieres ist eine Eigentumsverletzung."},
{c:"recht",t:"mc",q:"Welche Haftung regelt § 833 BGB für den Tierhalter?",
 o:["Gefährdungshaftung, auch ohne Verschulden","Haftung nur bei Vorsatz","Haftung nur bei grober Fahrlässigkeit","Keine Haftung bei Hunden"],a:[0],
 e:"Die typische Tiergefahr muss sich im Schaden verwirklicht haben. Entlastung nur bei Haustieren für Beruf oder Erwerb."},
{c:"recht",t:"mc",q:"Sie betreuen als Dogsitter vertraglich den Hund eines Kunden. Welche Rolle haben Sie im Haftungsrecht?",
 o:["Tieraufseher (§ 834 BGB)","Tierhalter (§ 833 BGB)","Eigentümer","Keine, nur der Halter haftet"],a:[0],
 e:"Wer für den Halter die Aufsicht durch Vertrag übernimmt, ist Tieraufseher. Der Kunde bleibt Halter."},
{c:"recht",t:"mc",q:"Wann haftet der Tieraufseher nach § 834 BGB nicht?",
 o:["Wenn er bei der Aufsicht die erforderliche Sorgfalt beachtet hat","Nie, er haftet immer","Wenn der Hund versichert ist","Wenn der Halter anwesend war"],a:[0],
 e:"Entlastungsbeweis möglich: das Verschulden wird vermutet, der Aufseher muss seine Sorgfalt beweisen. Deshalb dokumentieren."},
{c:"recht",t:"mc",q:"Was setzt die Haftung nach § 823 BGB voraus?",
 o:["Eigenes vorsätzliches oder fahrlässiges Verhalten","Nur dass man Halter ist","Einen Vertrag","Eine Versicherung"],a:[0],e:"§ 823 = Verschuldenshaftung."},
{c:"recht",t:"mc",q:"Eigentum allein begründet die Tierhalterhaftung …",
 o:["nicht","immer","nur bei Hunden","nur bei gewerblicher Haltung"],a:[0],
 e:"Halter ist, wer die Kosten trägt und über das Tier bestimmt – nicht automatisch der Eigentümer."},
{c:"recht",t:"mc",q:"Ein Pensionshund läuft durch ein offenes Tor und beißt einen Passanten. Wer kann haften?",
 o:["Halter, Pension und ggf. die Mitarbeiterin nebeneinander","Nur der Halter","Nur die Mitarbeiterin","Niemand, weil der Hund in Pension war"],a:[0],
 e:"Halter § 833, Pension § 834 und Vertrag, Mitarbeiterin ggf. § 823. Der interne Ausgleich folgt getrennt."},
{c:"recht",t:"mc",q:"Eine Mitarbeiterin verursacht einen Schaden mit leichter Fahrlässigkeit. Wer trägt ihn im Innenverhältnis grundsätzlich?",
 o:["Der Arbeitgeber / Betrieb","Die Mitarbeiterin allein","Beide je zur Hälfte, immer","Die Versicherung des Kunden"],a:[0],
 e:"Leichte Fahrlässigkeit → Betrieb; mittlere → Teilung; grobe → grundsätzlich Arbeitnehmer."},

<script>
(function(){
  "use strict";
  Q.forEach(function(q,i){ q.id = q.c + "-" + i; });
  const byId = {}; Q.forEach(function(q){ byId[q.id]=q; });
  const EXAM = new Date("2026-11-23T10:30:00+01:00");
  const $ = function(id){ return document.getElementById(id); };
  const esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); };

  // ---- storage (optional) ----
  const KEY = "skn11-quiz-v1";
  function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"{}"); return {wrong:s.wrong||[], last:s.last??null}; }catch(e){ return {wrong:[],last:null}; } }
  function save(st){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  let store = load();
  store.wrong = store.wrong.filter(function(id){ return byId[id]; });

  // ---- helpers ----
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function show(v){ ["v-start","v-quiz","v-result"].forEach(function(x){ $(x).classList.toggle("hidden", x!==v); }); window.scrollTo(0,0); }

  // ---- start screen ----
  const selected = new Set(Object.keys(CATS));
  function renderStart(){
    const days = Math.ceil((EXAM - new Date())/86400000);
    $("countdown").textContent = days > 1 ? (days + " giorni all'esame") : days === 1 ? "Esame domani" : days === 0 ? "Esame oggi" : "Esame passato";
    $("s-total").textContent = Q.length;
    $("s-wrong").textContent = store.wrong.length;
    $("s-last").textContent = store.last == null ? "–" : store.last + " %";
    $("m-err").disabled = store.wrong.length === 0;
    $("m-err-p").textContent = store.wrong.length ? ("Hai " + store.wrong.length + " domande sbagliate da rifare. Escono dalla lista quando rispondi giusto.") : "Nessun errore salvato per ora: fai prima un allenamento o una simulazione.";
    const box = $("chips"); box.innerHTML = "";
    Object.keys(CATS).forEach(function(k){
      const n = Q.filter(function(q){ return q.c===k; }).length;
      const lab = document.createElement("label");
      lab.className = "chip" + (selected.has(k) ? " on" : "");
      lab.innerHTML = '<input type="checkbox" id="c-'+k+'" '+(selected.has(k)?"checked":"")+'> '+esc(CATS[k])+' <small>'+n+'</small>';
      lab.querySelector("input").addEventListener("change", function(e){ if(e.target.checked) selected.add(k); else selected.delete(k); lab.classList.toggle("on", e.target.checked); $("m-train").disabled = selected.size===0; });
      box.appendChild(lab);
    });
    $("m-train").disabled = selected.size===0;
  }
  $("all-btn").addEventListener("click", function(){ if(selected.size===Object.keys(CATS).length){ selected.clear(); } else { Object.keys(CATS).forEach(function(k){ selected.add(k); }); } renderStart(); });

  // ---- session ----
  let S = null, timerId = null;
  function start(list, mode){
    S = {mode:mode, list:list, i:0, answers:[], checked:false, sel:new Set(), end: mode==="sim" ? Date.now()+60*60000 : null};
    show("v-quiz");
    $("timer").classList.toggle("hidden", mode!=="sim");
    clearInterval(timerId);
    if(mode==="sim"){ tick(); timerId = setInterval(tick, 1000); }
    renderQ();
  }
  function tick(){
    const left = Math.max(0, S.end - Date.now());
    const m = Math.floor(left/60000), s = Math.floor(left/1000)%60;
    $("timer").textContent = "⏱ " + m + ":" + String(s).padStart(2,"0");
    $("timer").classList.toggle("low", left < 5*60000);
    if(left===0){ clearInterval(timerId); finish(); }
  }

  $("m-sim").addEventListener("click", function(){
    const mc = shuffle(Q.filter(function(q){ return q.t!=="open"; }));
    // balanced draw: at least 2 per category, rest random
    const pick = []; const used = new Set();
    Object.keys(CATS).forEach(function(k){ mc.filter(function(q){return q.c===k;}).slice(0, k==="recht"?5:2).forEach(function(q){ pick.push(q); used.add(q.id); }); });
    mc.forEach(function(q){ if(pick.length<30 && !used.has(q.id)){ pick.push(q); used.add(q.id); } });
    const op = shuffle(Q.filter(function(q){ return q.t==="open"; })).slice(0,5);
    start(shuffle(pick.slice(0,30)).concat(op), "sim");
  });
  $("m-train").addEventListener("click", function(){
    let pool = Q.filter(function(q){ return selected.has(q.c) && ($("open-chk").checked || q.t!=="open"); });
    const n = +$("n-sel").value; pool = shuffle(pool); if(n) pool = pool.slice(0,n);
    if(!pool.length) return; start(pool, "train");
  });
  $("m-err").addEventListener("click", function(){ const pool = shuffle(store.wrong.map(function(id){ return byId[id]; })); if(pool.length) start(pool, "train"); });
  $("quit").addEventListener("click", function(){ if(S.answers.length) finish(); else { clearInterval(timerId); renderStart(); show("v-start"); } });

  function renderQ(){
    const q = S.list[S.i]; S.checked=false; S.sel=new Set();
    $("q-count").textContent = "Domanda " + (S.i+1) + " di " + S.list.length;
    $("q-bar").style.width = (S.i / S.list.length * 100) + "%";
    const c = $("q-card");
    let h = '<span class="tag">'+esc(CATS[q.c])+(q.t==="open"?" · domanda aperta":"")+'</span><p class="q">'+esc(q.q)+'</p>';
    if(q.t==="multi") h += '<div class="hint">Più risposte corrette – seleziona tutte quelle giuste.</div>';
    if(q.t==="open"){
      h += '<label class="small" for="ans">Scrivi la risposta in tedesco, senza guardare gli appunti.</label><textarea id="ans" placeholder="Antwort …"></textarea><div id="openfb"></div>';
    } else {
      if(!q._order) q._order = shuffle(q.o.map(function(_,i){return i;}));
      h += '<div class="opts">' + q._order.map(function(oi,pos){ return '<button type="button" class="opt'+(q.t==="multi"?" multi":"")+'" data-oi="'+oi+'"><span class="k">'+(pos+1)+'</span><span>'+esc(q.o[oi])+'</span></button>'; }).join("") + '</div><div id="mcfb"></div>';
    }
    h += '<div class="actions"><span></span><button class="btn" type="button" id="next"></button></div>';
    c.innerHTML = h;
    q._order = null;
    c.querySelectorAll(".opt").forEach(function(b){ b.addEventListener("click", function(){ pick(+b.dataset.oi); }); });
    updateNextBtn();
    $("next").addEventListener("click", next);
    const ta = $("ans"); if(ta) ta.addEventListener("input", updateNextBtn);
  }
  function pick(oi){
    if(S.checked) return;
    const q = S.list[S.i];
    if(q.t==="multi"){ if(S.sel.has(oi)) S.sel.delete(oi); else S.sel.add(oi); }
    else { S.sel = new Set([oi]); }
    $("q-card").querySelectorAll(".opt").forEach(function(b){ b.classList.toggle("sel", S.sel.has(+b.dataset.oi)); });
    updateNextBtn();
  }
  function updateNextBtn(){
    const q = S.list[S.i], b = $("next"); if(!b) return;
    const last = S.i === S.list.length-1;
    if(q.t==="open"){
      if(!S.checked){ b.textContent = "Mostra la soluzione"; b.disabled = false; }
      else { b.textContent = last ? "Vedi il risultato" : "Avanti →"; b.disabled=false; }
    } else if(S.mode==="sim"){
      b.textContent = last ? "Vedi il risultato" : "Avanti →"; b.disabled = S.sel.size===0;
    } else {
      b.textContent = S.checked ? (last ? "Vedi il risultato" : "Avanti →") : "Controlla"; b.disabled = !S.checked && S.sel.size===0;
    }
  }
  function sameSet(a,b){ if(a.size!==b.length) return false; return b.every(function(x){ return a.has(x); }); }

  function next(){
    const q = S.list[S.i];
    if(q.t==="open"){
      if(!S.checked){ revealOpen(q); return; }
      const boxes = Array.from(document.querySelectorAll("#openfb input"));
      const got = boxes.filter(function(x){return x.checked;}).length;
      S.answers.push({q:q, score: boxes.length ? got/boxes.length : 0, text: $("ans").value, missed: q.k.filter(function(_,i){ return !boxes[i].checked; })});
      return advance();
    }
    if(S.mode==="sim"){
      S.answers.push({q:q, score: sameSet(S.sel,q.a)?1:0, sel:Array.from(S.sel)});
      return advance();
    }
    if(!S.checked){ checkMC(q); return; }
    advance();
  }
  function checkMC(q){
    S.checked = true;
    const ok = sameSet(S.sel, q.a);
    $("q-card").querySelectorAll(".opt").forEach(function(b){
      const oi=+b.dataset.oi; b.disabled=true;
      if(q.a.indexOf(oi)>=0) b.classList.add("right"); else if(S.sel.has(oi)) b.classList.add("wrong");
      b.classList.remove("sel");
    });
    $("mcfb").innerHTML = '<div class="fb '+(ok?"ok":"no")+'"><b class="v">'+(ok?"Giusto.":"Sbagliato.")+'</b> '+esc(q.e)+'</div>';
    S.answers.push({q:q, score: ok?1:0, sel:Array.from(S.sel)});
    updateNextBtn();
  }
  function revealOpen(q){
    S.checked = true;
    $("ans").readOnly = true;
    $("openfb").innerHTML = '<div class="model"><h4>Risposta modello</h4>'+esc(q.m)+'</div><div class="model" style="background:transparent;border:1px solid var(--line)"><h4>Spunta i punti che hai scritto</h4><div class="checks">'+q.k.map(function(k,i){ return '<label for="k'+i+'"><input type="checkbox" id="k'+i+'"> '+esc(k)+'</label>'; }).join("")+'</div></div>';
    updateNextBtn();
  }
  function advance(){
    // update error list
    const a = S.answers[S.answers.length-1];
    const idx = store.wrong.indexOf(a.q.id);
    if(a.score < 1 && idx<0) store.wrong.push(a.q.id);
    if(a.score === 1 && idx>=0) store.wrong.splice(idx,1);
    save(store);
    if(S.i < S.list.length-1){ S.i++; renderQ(); } else finish();
  }

  function finish(){
    clearInterval(timerId);
    const ans = S.answers;
    const total = ans.length;
    const pts = ans.reduce(function(s,a){ return s+a.score; },0);
    const pct = total ? Math.round(pts/total*100) : 0;
    if(S.mode==="sim"){ store.last = pct; save(store); }
    $("r-pct").textContent = pct + " %";
    $("r-title").textContent = S.mode==="sim" ? "Simulazione finita" : "Allenamento finito";
    const missedCount = ans.filter(function(a){return a.score<1;}).length;
    $("r-sub").textContent = (Math.round(pts*10)/10).toString().replace(".",",") + " punti su " + total + " domande risposte" + (total < S.list.length ? " (su " + S.list.length + ")" : "") + " · " + missedCount + " da rivedere";
    // per category
    const per = {};
    ans.forEach(function(a){ const k=a.q.c; per[k]=per[k]||{p:0,n:0}; per[k].p+=a.score; per[k].n++; });
    $("r-cats").innerHTML = Object.keys(CATS).filter(function(k){return per[k];}).map(function(k){
      const v = Math.round(per[k].p/per[k].n*100);
      const col = v>=80 ? "var(--good)" : v>=50 ? "var(--warn)" : "var(--bad)";
      return '<div class="cat"><span>'+esc(CATS[k])+'</span><span class="track"><i style="width:'+v+'%;background:'+col+'"></i></span><em>'+v+' %</em></div>';
    }).join("");
    // review
    const rev = ans.filter(function(a){ return a.score<1; });
    $("r-rev-h").classList.toggle("hidden", !rev.length);
    $("r-again").disabled = !rev.length;
    $("r-review").innerHTML = rev.map(function(a){
      const q=a.q;
      if(q.t==="open"){
        return '<div class="rv part"><span class="tag">'+esc(CATS[q.c])+' · aperta · '+Math.round(a.score*100)+' %</span><p><b>'+esc(q.q)+'</b></p>'+(a.text?'<p class="lbl">La tua risposta</p><p>'+esc(a.text)+'</p>':'')+'<p class="lbl">Punti mancanti</p><p>'+esc(a.missed.join(" · "))+'</p><p class="lbl">Risposta modello</p><p>'+esc(q.m)+'</p></div>';
      }
      const yours = a.sel && a.sel.length ? a.sel.map(function(i){return q.o[i];}).join(" · ") : "nessuna";
      return '<div class="rv"><span class="tag">'+esc(CATS[q.c])+'</span><p><b>'+esc(q.q)+'</b></p><p class="lbl">La tua risposta</p><p>'+esc(yours)+'</p><p class="lbl">Corretta</p><p>'+esc(q.a.map(function(i){return q.o[i];}).join(" · "))+'</p><p class="small">'+esc(q.e)+'</p></div>';
    }).join("");
    S.review = rev.map(function(a){return a.q;});
    show("v-result");
  }
  $("r-again").addEventListener("click", function(){ if(S && S.review && S.review.length) start(shuffle(S.review), "train"); });
  $("r-home").addEventListener("click", function(){ renderStart(); show("v-start"); });

  // keyboard
  document.addEventListener("keydown", function(e){
    if($("v-quiz").classList.contains("hidden")) return;
    if(e.target.tagName==="TEXTAREA") return;
    const n = parseInt(e.key,10);
    if(n>=1 && n<=9){ const b = document.querySelectorAll(".opt")[n-1]; if(b && !b.disabled) b.click(); }
    if(e.key==="Enter"){ const b=$("next"); if(b && !b.disabled){ e.preventDefault(); b.click(); } }
  });

  renderStart();
})();
</script>
</body>
</html>
